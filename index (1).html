/* =====================================================================
   Himoya qatlami — muallif atributsiyasi, hujjat identifikatori,
   ma’lumot maxfiyligi va (ixtiyoriy) kirish qulfi.
   ===================================================================== */
async function fcHash(s){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
}
if(typeof window!=="undefined") window.fcHash = fcHash;

/* Hisobot identifikatori: kiritilgan ma’lumotlardan olingan qisqa barmoq izi.
   Bir xil kirish → bir xil ID; hisobot o‘zgartirilsa ID mos kelmay qoladi. */
function docId(){
  const src = JSON.stringify([S.a, S.acts, S.labs]);
  let h1=0x811c9dc5, h2=0x01000193;
  for(let i=0;i<src.length;i++){
    h1 = ((h1 ^ src.charCodeAt(i)) * 0x01000193) >>> 0;
    h2 = ((h2 + src.charCodeAt(i)*(i+7)) * 0x85ebca6b) >>> 0;
  }
  return (h1.toString(16).padStart(8,"0") + h2.toString(16).padStart(8,"0")).slice(0,10).toUpperCase();
}

function stamp(){
  const id = docId();
  const who = (AUTH.user && (AUTH.user.name || AUTH.user.login)) ? (AUTH.user.name || fmtLogin(AUTH.user)) + " · " : (APP.author ? APP.author + " · " : "");
  const line = `${who}Food Calculator v${APP.version} (${APP.build}) · ` +
               `${LANG?"Report ID":"Hisobot ID"} ${id} · ` +
               `${LANG?"generated":"yaratildi"} ${new Date().toISOString().slice(0,16).replace("T"," ")} · ` +
               t("priv");
  const el=$("#app-id"); if(el) el.textContent = line;
  const wm=$("#wm-text");
  if(wm) wm.textContent = (APP.author || "Food Calculator") + " · " + id;
  return {id, line};
}

/* ---------- chop etish ----------
   Artefakt/iframe ichida window.print() sandbox tomonidan bloklanadi
   ("allow-modals" yo‘q). Shu sababli mustaqil hisobot hujjati yig‘iladi:
   avval yangi oynada ochib ko‘riladi, u ham bloklansa — fayl sifatida
   yuklanadi. Fayl alohida ochilganda oddiy chop etish oynasi chaqiriladi. */
function buildReportHTML(){
  const style = Array.from(document.querySelectorAll("style"))
    .map(s=>s.outerHTML).join("\n");
  const links = Array.from(document.querySelectorAll('link[rel="stylesheet"]'))
    .map(l=>l.outerHTML).join("\n");
  const clone = document.createElement("div");
  clone.innerHTML = document.querySelector("main").innerHTML;
  const inst = document.querySelector(".instbar").outerHTML;
  clone.querySelectorAll(".noprint").forEach(e=>e.remove());
  clone.querySelectorAll(".panel").forEach(p=>p.removeAttribute("hidden"));
  /* forma maydonlarini bosma matnga aylantirish */
  clone.querySelectorAll("input,select").forEach(el=>{
    const span=document.createElement("span");
    span.className="mono";
    span.style.cssText="display:inline-block;border-bottom:1px solid #999;padding:2px 4px;min-width:60px";
    span.textContent = el.tagName==="SELECT"
      ? (el.options[el.selectedIndex] ? el.options[el.selectedIndex].textContent : "—")
      : (el.value || "—");
    el.replaceWith(span);
  });
  const title = "Food Calculator — " + (S.a.name || "hisobot") + " — " +
                (S.a.date || new Date().toISOString().slice(0,10));
  const st = stamp();
  return `<!DOCTYPE html><html lang="${LANG?"en":"uz"}"><head><meta charset="utf-8">
<title>${esc(title)}</title>${links}${style}
<style>body{background:#fff}main{max-width:1180px;margin:0 auto;padding:16px 22px}
.panel{break-before:page}.panel:first-of-type{break-before:auto}
@media screen{.panel{margin-bottom:34px;padding-bottom:20px;border-bottom:2px solid var(--line)}
 .wm{display:block;position:fixed;inset:0;z-index:-1;pointer-events:none}
 .wm span{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) rotate(-28deg);
  font-family:var(--cond);font-size:52px;font-weight:700;letter-spacing:.14em;
  color:rgba(15,23,26,.055);white-space:nowrap;text-transform:uppercase}}
.rfoot{border-top:1px solid #999;margin:20px 22px 30px;padding-top:7px;
 font-family:var(--mono);font-size:9.5px;color:#444;line-height:1.5}
.pbar{position:sticky;top:0;background:var(--ink);color:#F4F6F1;padding:10px 22px;
 font-family:var(--cond);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
@media print{.pbar{display:none}}</style></head><body>
<div class="pbar">${LANG?"Press Ctrl+P (Cmd+P) to save as PDF":"PDF ga saqlash uchun Ctrl+P (Cmd+P) bosing"}</div>
<div class="wm" aria-hidden="true"><span>${esc((APP.author||"Food Calculator")+" · "+st.id)}</span></div>
${inst}<main>${clone.innerHTML}</main>
<div class="rfoot">${esc(st.line)}</div>
<script>window.addEventListener("load",function(){setTimeout(function(){try{window.print();}catch(e){}},700);});<\/script>
</body></html>`;
}

function printReport(msgFn){
  const inFrame = (()=>{ try{ return window.self !== window.top; }catch(e){ return true; } })();
  if(!inFrame){ window.print(); return; }
  const html = buildReportHTML();
  const url = URL.createObjectURL(new Blob([html], {type:"text/html"}));
  let w = null;
  try { w = window.open(url, "_blank"); } catch(e) { w = null; }
  if(w){ if(msgFn) msgFn(t("pr.tab")); }
  else {
    const a=document.createElement("a");
    a.href=url; a.download="food_calculator_"+(S.a.name||"hisobot")+".html";
    document.body.appendChild(a); a.click(); a.remove();
    if(msgFn) msgFn(t("pr.iframe"));
  }
  setTimeout(()=>URL.revokeObjectURL(url), 120000);
}

function download(fn, txt, mime){
  const b=new Blob([txt],{type:mime+";charset=utf-8"}), u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=fn; a.click();
  setTimeout(()=>URL.revokeObjectURL(u), 3000);
}

<script>
"use strict";
/* =====================================================================
   Kirish ekrani va «Ma’lumotlar» ilovasi interfeysi
   ===================================================================== */
let AU_MODE = "in";   // "in" = kirish, "up" = ro‘yxatdan o‘tish

function auSetMode(m){
  AU_MODE = m;
  $("#au-tab-in").setAttribute("aria-selected", m==="in" ? "true":"false");
  $("#au-tab-up").setAttribute("aria-selected", m==="up" ? "true":"false");
  $$(".au-up").forEach(e=>e.hidden = m!=="up");
  $$(".au-consent").forEach(e=>e.hidden = !(REMOTE && m==="up"));
  $("#au-note").textContent = t(REMOTE ? "auth.remote" : "auth.local");
  const mc = $("#au-mode"); mc.textContent = t(REMOTE ? "mode.remote" : "mode.local");
  mc.classList.toggle("on", REMOTE);
  $("#au-go").textContent = t(m==="up" ? "auth.signup" : "auth.signin");
  $("#au-pw").setAttribute("autocomplete", m==="up" ? "new-password" : "current-password");
  $("#au-err").textContent = ""; $("#au-err").classList.remove("okmsg");
}

let AU_BUSY = false;
async function auSubmit(){
  if(AU_BUSY) return;
  const err = $("#au-err"), go = $("#au-go");
  err.textContent = ""; err.classList.remove("okmsg");
  const login = $("#au-login").value, pw = $("#au-pw").value;
  if(AU_MODE === "up"){
    if(!normLogin(login)){ err.textContent = t("auth.badlogin"); return; }
    if(pw !== $("#au-pw2").value){ err.textContent = t("auth.mismatch"); return; }
    if(REMOTE && !$("#au-consent").checked){ err.textContent = t("auth.noconsent"); return; }
  }
  AU_BUSY = true; go.disabled = true; go.textContent = t("auth.wait");
  let r;
  try{
    r = AU_MODE === "up"
      ? await AUTH.register(login, pw, $("#au-name").value, $("#au-role").value, $("#au-consent").checked)
      : await AUTH.login(login, pw);
  } finally {
    AU_BUSY = false; go.disabled = false;
    go.textContent = t(AU_MODE === "up" ? "auth.signup" : "auth.signin");
  }
  if(r.err){ err.textContent = t(r.err); return; }
  if(r.pending){                       // server: administrator tasdig‘i kerak
    auSetMode("in");
    err.textContent = t("auth.pendingreg"); err.classList.add("okmsg");
    $("#au-pw").value = ""; if($("#au-pw2")) $("#au-pw2").value = "";
    return;
  }
  await auEnter(r.user, $("#au-remember").checked, r.token);
}

async function auEnter(user, remember, token){
  AUTH.user = user; AUTH.token = token || null; AUTH._cache = null;
  if(remember) await store.set("fc:session",
    {login:user.login, until:Date.now() + 30*24*3600*1000, token:AUTH.token, remote:REMOTE});
  $("#lock").hidden = true;
  $("#au-pw").value = ""; if($("#au-pw2")) $("#au-pw2").value = "";
  drawUserChip();
  if(!S.booted){ S.booted = true; boot(); }
  const d = await AUTH.data();
  if(d.last) applySnapshot(d.last);
  drawRecords();
}

async function auSignOut(){
  await store.set("fc:session", null);
  AUTH.user = null; AUTH.token = null; AUTH._cache = null;
  if(typeof admReset === "function") admReset();
  $("#userchip").hidden = true;
  $("#lock").hidden = false;
  auSetMode("in");
  $("#au-login").focus();
}

async function auSessionLost(code){
  if(!AUTH.user) return;
  await auSignOut();
  const e = $("#au-err"); e.textContent = t(code || "auth.expired");
}

function drawUserChip(){
  const u = AUTH.user, chip = $("#userchip");
  const isAdm = !!(REMOTE && u && u.admin);
  const tb = $('[data-tab="adm"]'); if(tb) tb.hidden = !isAdm;
  $("#uc-adm").hidden = !isAdm;
  if(!isAdm && $("#p-adm") && !$("#p-adm").hidden && typeof setTab === "function") setTab("in");
  if(!u){ chip.hidden = true; return; }
  chip.hidden = false;
  $("#uc-name").textContent = u.name || t("role."+(u.role||"other"));
  $("#uc-login").textContent = fmtLogin(u);
}

/* ---------- yozuvlar ro‘yxati ---------- */
async function drawRecords(){
  const box = $("#db-list"); if(!box || !AUTH.user) return;
  const d = await AUTH.data();
  if(d.err) dbMsg(t(d.err));
  const q = ($("#db-search") ? $("#db-search").value : "").trim().toLowerCase();
  let recs = d.records || [];
  if(q) recs = recs.filter(r =>
    (r.name||"").toLowerCase().includes(q) || (r.date||"").includes(q) ||
    (r.id||"").toLowerCase().includes(q));

  $("#db-count").textContent = `${recs.length} / ${(d.records||[]).length}`;
  box.innerHTML = recs.length ? recs.map(r=>{
    const sp = SPORTS[r.sport] ? SPORTS[r.sport][LANG?"en":"uz"] : "—";
    const bits = [r.date, n(r.wt,1)+" kg", n(r.kcal)+" kkal"];
    if(r.idx && r.idx.MRI!=null) bits.push("MRI "+n(r.idx.MRI,1));
    bits.push("ID "+r.id);
    return `<div class="rec">
      <div>
        <div class="r1">${esc(r.name||"—")} <span style="color:var(--mute);font-weight:400">· ${esc(sp)}</span></div>
        <div class="r2">${esc(bits.join(" · "))}</div>
      </div>
      <div class="acts noprint">
        <button class="btn sm ghost" data-open="${esc(r.id)}">${esc(t("db.open"))}</button>
        <button class="xbtn" data-del="${esc(r.id)}" aria-label="delete">×</button>
      </div></div>`;
  }).join("") : `<div class="empty">${esc(t("db.empty"))}</div>`;

  box.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click", async()=>{
    if(await loadRecord(b.dataset.open)) dbMsg(t("db.loaded")+" — ID "+b.dataset.open);
  }));
  box.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click", async()=>{
    const r = await deleteRecord(b.dataset.del);
    if(r && r.err) dbMsg(t(r.err));
    drawRecords();
  }));

  const u = AUTH.user;
  $("#db-acc").innerHTML = statBlock([
    {k:t("auth.login"), v:`<span style="font-size:13px">${esc(fmtLogin(u))}</span>`},
    {k:t("auth.role"),  v:`<span style="font-size:13px">${esc(t("role."+(u.role||"other")))}</span>`},
    {k:t("db.recs"),    v:n((d.records||[]).length)},
    {k:t("db.since"),   v:`<span style="font-size:13px">${esc((u.created||"").slice(0,10))}</span>`}
  ]);
}

let dbT;
function dbMsg(x){ const e=$("#db-msg"); if(!e) return;
  e.textContent = x; clearTimeout(dbT); dbT = setTimeout(()=>e.textContent="", 6000); }

function wireAuth(){
  $("#au-tab-in").addEventListener("click", ()=>auSetMode("in"));
  $("#au-tab-up").addEventListener("click", ()=>auSetMode("up"));
  $("#au-go").addEventListener("click", auSubmit);
  ["au-login","au-pw","au-pw2","au-name"].forEach(id=>{
    const e=$("#"+id); if(e) e.addEventListener("keydown", ev=>{ if(ev.key==="Enter") auSubmit(); });
  });
  $("#b-logout").addEventListener("click", auSignOut);

  $("#b-rec-save").addEventListener("click", async()=>{
    const r = await saveRecord();
    if(r.err){ dbMsg(t(r.err)); return; }
    await drawRecords(); dbMsg(t("db.saved")+" — ID "+r.rec.id);
  });
  $("#db-search").addEventListener("input", drawRecords);
  $("#b-db-export").addEventListener("click", async()=>{
    const c = await exportAll(); dbMsg(t("db.exported")+": "+c);
  });
  $("#b-db-import").addEventListener("click", ()=>$("#db-file").click());
  $("#db-file").addEventListener("change", async e=>{
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const r = await importAll(await f.text());
    e.target.value = "";
    if(r.err){ dbMsg(t(r.err)); return; }
    await drawRecords(); dbMsg(`${t("db.imported")}: +${r.added} (${r.total})`);
  });
  $("#b-pw").addEventListener("click", async()=>{
    const r = await AUTH.changePw(AUTH.user.login, $("#pw-old").value, $("#pw-new").value);
    const m = $("#pw-msg");
    m.textContent = r.err ? t(r.err) : t("db.pwok");
    if(!r.err){ AUTH.user = Object.assign({}, AUTH.user, r.user); $("#pw-old").value=""; $("#pw-new").value=""; }
    setTimeout(()=>m.textContent="", 6000);
  });
}

/* ---------- ishga tushirish ---------- */
async function initAuth(){
  wireAuth();
  auSetMode("in");
  const s = await store.get("fc:session");
  if(s && s.login && s.until > Date.now()){
    if(REMOTE && s.token){
      AUTH.token = s.token;
      const r = await api("me");
      if(r.user){ await auEnter(r.user, true, s.token); return; }
      AUTH.token = null;
      if(r.err === "net.fail") $("#au-err").textContent = t("net.fail");
      else await store.set("fc:session", null);
      if(r.err && r.err !== "net.fail") $("#au-err").textContent = t(r.err);
    } else if(!REMOTE && !s.remote){
      const users = await AUTH.users();
      if(users[s.login]){ await auEnter(users[s.login], true); return; }
    }
  }
  $("#lock").hidden = false;
  setTimeout(()=>{ const e=$("#au-login"); if(e) e.focus(); }, 60);
}
</script>
<script>
"use strict";
/* =====================================================================
   9 · ADMINISTRATOR ARXIVI (faqat server rejimida va admin hisobida)
   ===================================================================== */
const ADM = {data:null, shown:200, busy:false, wired:false};

function admReset(){ ADM.data = null; ADM.shown = 200; }
function admMsg(x){ const e=$("#adm-msg"); if(!e) return; e.textContent = x || "";
  clearTimeout(admMsg.t); if(x) admMsg.t = setTimeout(()=>e.textContent="", 8000); }
const admDT = v => v ? String(v).replace("T"," ").slice(0,16) : "—";
const admSport = k => SPORTS[k] ? SPORTS[k][LANG?"en":"uz"] : (k || "—");

async function admLoad(force){
  if(!REMOTE || !AUTH.user || !AUTH.user.admin) return;
  admWire();
  if(ADM.data && !force){ admDraw(); return; }
  if(ADM.busy) return;
  ADM.busy = true; $("#adm-sync").textContent = t("adm.loading");
  const r = await api("adminOverview");
  ADM.busy = false;
  if(r.err){ $("#adm-sync").textContent = ""; admMsg(t(r.err)); return; }
  ADM.data = r;
  $("#adm-sync").textContent = t("adm.synced") + " " + admDT(r.serverTime);
  admDraw();
}

function admDraw(){
  const D = ADM.data; if(!D) return;
  const users = D.users || [], recs = D.records || [];
  const live = recs.filter(r=>!r.deleted);
  const athletes = new Set(live.map(r=>(r.name||"").trim().toLowerCase()).filter(x=>x && x!=="—"));
  const pending = users.filter(u=>u.status==="pending").length;
  const lastB = (D.backups||[])[0];
  $("#adm-stats").innerHTML = statBlock([
    {k:t("adm.s.users"),    v:n(users.length)},
    {k:t("adm.s.pending"),  v: pending ? `<span style="color:var(--alarm)">${n(pending)}</span>` : "0"},
    {k:t("adm.s.records"),  v:n(live.length)},
    {k:t("adm.s.athletes"), v:n(athletes.size)},
    {k:t("adm.s.backup"),   v:`<span style="font-size:13px">${esc(lastB ? admDT(lastB.ts) : "—")}</span>`}
  ]);
  const sh=$("#a-adm-sheet"), fo=$("#a-adm-folder");
  if(D.sheetUrl){ sh.href = D.sheetUrl; sh.removeAttribute("aria-disabled"); }
  if(D.folderUrl){ fo.href = D.folderUrl; fo.removeAttribute("aria-disabled"); }
  $("#adm-approval").checked = !!D.requireApproval;

  $("#adm-backups").innerHTML = (D.backups||[]).length ? D.backups.map(b=>`
    <div class="bk"><span>${esc(admDT(b.ts))} · ${esc(b.by==="auto" ? t("adm.auto") : b.by)} · ${n(b.records)}</span>
      <span><a href="${esc(b.jsonUrl)}" target="_blank" rel="noopener">JSON</a> ·
            <a href="${esc(b.csvUrl)}" target="_blank" rel="noopener">CSV</a></span></div>`).join("")
    : `<div class="hint">${esc(t("adm.nobackup"))}</div>`;

  // filtr ro‘yxatlari
  const fu=$("#adm-fuser"), cur=fu.value;
  fu.innerHTML = `<option value="">${esc(t("adm.f.all"))}</option>` +
    users.map(u=>`<option value="${esc(u.login)}">${esc((u.name||u.login))}${u.name?" · "+esc(fmtLogin(u)):""}</option>`).join("");
  fu.value = cur;
  const fs=$("#adm-fsport"), cs=fs.value;
  fs.innerHTML = `<option value="">${esc(t("adm.f.all"))}</option>` +
    Object.keys(SPORTS).map(k=>`<option value="${k}">${esc(admSport(k))}</option>`).join("");
  fs.value = cs;

  admDrawUsers(); admDrawRecs();
}

function admDrawUsers(){
  const D = ADM.data; if(!D) return;
  const q = $("#adm-usearch").value.trim().toLowerCase();
  const order = {pending:0, active:1, blocked:2};
  let list = (D.users||[]).slice().sort((a,b)=>(order[a.status]-order[b.status]) ||
    String(b.created).localeCompare(String(a.created)));
  if(q) list = list.filter(u=>(u.name||"").toLowerCase().includes(q) || u.login.toLowerCase().includes(q));
  $("#adm-ucount").textContent = `${list.length} / ${(D.users||[]).length}`;
  const tag = {active:"ok", pending:"warn", blocked:"bad"};
  $("#adm-utab").innerHTML = `<thead><tr>
      <th>${esc(t("adm.c.user"))}</th><th>${esc(t("auth.role"))}</th><th>${esc(t("adm.c.status"))}</th>
      <th>${esc(t("adm.c.created"))}</th><th>${esc(t("adm.c.last"))}</th>
      <th class="n">${esc(t("adm.c.recs"))}</th><th></th></tr></thead><tbody>` +
    list.map(u=>{
      const me = u.login === AUTH.user.login;
      let acts = "";
      if(!me){
        if(u.status==="pending") acts += `<button class="btn sm acc" data-us="active" data-l="${esc(u.login)}">${esc(t("adm.approve"))}</button>`;
        if(u.status==="active")  acts += `<button class="btn sm ghost" data-us="blocked" data-l="${esc(u.login)}">${esc(t("adm.block"))}</button>`;
        if(u.status==="blocked") acts += `<button class="btn sm ghost" data-us="active" data-l="${esc(u.login)}">${esc(t("adm.unblock"))}</button>`;
        if(u.status==="active")  acts += `<button class="btn sm ghost" data-ua="${u.admin?"0":"1"}" data-l="${esc(u.login)}">${esc(t(u.admin?"adm.rmadmin":"adm.mkadmin"))}</button>`;
      }
      return `<tr>
        <td class="u"><b>${esc(u.name || "—")}${me?` <span>(${esc(t("adm.you"))})</span>`:""}</b><span>${esc(fmtLogin(u))}</span></td>
        <td>${esc(t("role."+(u.role||"other")))}${u.admin?` <span class="tag info">${esc(t("adm.badge"))}</span>`:""}</td>
        <td><span class="tag ${tag[u.status]||""}">${esc(t("st."+u.status))}</span></td>
        <td class="mono">${esc(admDT(u.created).slice(0,10))}</td>
        <td class="mono">${esc(admDT(u.lastLogin))}</td>
        <td class="n">${n(u.records||0)}</td>
        <td class="a noprint">${acts}</td></tr>`;
    }).join("") + `</tbody>`;

  $("#adm-utab").querySelectorAll("[data-us],[data-ua]").forEach(b=>b.addEventListener("click", async()=>{
    b.disabled = true;
    const body = {login:b.dataset.l};
    if(b.dataset.us) body.status = b.dataset.us;
    if(b.dataset.ua) body.admin = b.dataset.ua === "1";
    const r = await api("adminSetUser", body);
    if(r.err){ admMsg(t(r.err)); b.disabled = false; return; }
    const i = ADM.data.users.findIndex(u=>u.login===r.user.login);
    if(i>=0) ADM.data.users[i] = r.user;
    admDraw();
  }));
}

function admFiltered(){
  const D = ADM.data; if(!D) return [];
  const q = $("#adm-q").value.trim().toLowerCase(), fu = $("#adm-fuser").value,
        fs = $("#adm-fsport").value, from = $("#adm-from").value, to = $("#adm-to").value,
        del = $("#adm-showdel").checked;
  return (D.records||[]).filter(r=>{
    if(!del && r.deleted) return false;
    if(fu && r.owner !== fu) return false;
    if(fs && r.sport !== fs) return false;
    if(from && (r.date||"") < from) return false;
    if(to && (r.date||"") > to) return false;
    if(q && !([r.name, r.owner, r.ownerName, r.id].join(" ").toLowerCase().includes(q))) return false;
    return true;
  });
}

function admDrawRecs(){
  const D = ADM.data; if(!D) return;
  const list = admFiltered(), shown = list.slice(0, ADM.shown);
  $("#adm-rcount").textContent = `${list.length} / ${(D.records||[]).filter(r=>!r.deleted).length}`;
  const f1 = v => v==null ? "—" : n(v,1);
  $("#adm-rtab").innerHTML = shown.length ? `<thead><tr>
      <th>${esc(t("adm.c.date"))}</th><th>${esc(t("adm.c.athlete"))}</th><th>${esc(t("f.sport"))}</th>
      <th class="n">kg</th><th class="n">TDEE</th><th class="n">kkal</th>
      <th class="n">AI</th><th class="n">EDI</th><th class="n">HSI</th><th class="n">MRI</th>
      <th>${esc(t("adm.c.by"))}</th><th>${esc(t("adm.c.saved"))}</th><th></th></tr></thead><tbody>` +
    shown.map((r,i)=>`<tr class="${r.deleted?"del":""}">
      <td class="mono">${esc(r.date||"—")}</td>
      <td class="u"><b>${esc(r.name||"—")}</b><span>${esc([r.sex==="f"?"F":r.sex==="m"?"M":"", r.age!=null?r.age:""].filter(Boolean).join(" · "))}</span></td>
      <td>${esc(admSport(r.sport))}${r.deleted?` <span class="tag bad">${esc(t("st.deleted"))}</span>`:""}</td>
      <td class="n">${f1(r.wt)}</td><td class="n">${n(r.tdee)}</td><td class="n">${n(r.kcal)}</td>
      <td class="n">${f1(r.idx&&r.idx.AI)}</td><td class="n">${f1(r.idx&&r.idx.EDI)}</td>
      <td class="n">${f1(r.idx&&r.idx.HSI)}</td><td class="n">${f1(r.idx&&r.idx.MRI)}</td>
      <td class="u"><b>${esc(r.ownerName||"—")}</b><span>${esc(r.owner)}</span></td>
      <td class="mono">${esc(admDT(r.savedAt))}</td>
      <td class="a noprint">
        <button class="btn sm ghost" data-ro="${i}">${esc(t("adm.open"))}</button>
        ${r.deleted?`<button class="btn sm ghost" data-rr="${i}">${esc(t("adm.restore"))}</button>`:""}
        <button class="xbtn" data-rd="${i}" title="${esc(t("adm.purge"))}" aria-label="${esc(t("adm.purge"))}">×</button>
      </td></tr>`).join("") + `</tbody>`
    : `<tbody><tr><td class="empty">${esc(t("adm.empty"))}</td></tr></tbody>`;

  $("#adm-more").innerHTML = list.length > ADM.shown
    ? `<button class="btn sm ghost" id="b-adm-more">${esc(t("adm.more"))} (${n(list.length-ADM.shown)})</button>` : "";
  const mb = $("#b-adm-more"); if(mb) mb.addEventListener("click", ()=>{ ADM.shown += 200; admDrawRecs(); });

  const tb = $("#adm-rtab");
  tb.querySelectorAll("[data-ro]").forEach(b=>b.addEventListener("click", ()=>{
    const r = shown[+b.dataset.ro]; if(!r || !r.snapshot) return;
    applySnapshot(r.snapshot); setTab("res");
    admMsg(t("adm.opened") + ": " + (r.name||"—"));
  }));
  tb.querySelectorAll("[data-rr]").forEach(b=>b.addEventListener("click", async()=>{
    const r = shown[+b.dataset.rr]; b.disabled = true;
    const x = await api("adminRestoreRecord", {owner:r.owner, id:r.id});
    if(x.err){ admMsg(t(x.err)); b.disabled=false; return; }
    r.deleted = false; admDraw();
  }));
  tb.querySelectorAll("[data-rd]").forEach(b=>b.addEventListener("click", async()=>{
    const r = shown[+b.dataset.rd];
    if(!confirm(t("adm.purgeq") + "\n\n" + (r.name||"—") + " · " + (r.date||"") + " · " + r.owner)) return;
    b.disabled = true;
    const x = await api("adminDeleteRecord", {owner:r.owner, id:r.id});
    if(x.err){ admMsg(t(x.err)); b.disabled=false; return; }
    ADM.data.records = ADM.data.records.filter(y=>y!==r); admDraw();
  }));
}

/* ---------- eksport: filtrlangan yozuvlar ---------- */
function admCSV(list){
  const cell = v => { let s = v==null ? "" : String(v);
    if(/^[=+\-@\t\r]/.test(s) && isNaN(Number(s))) s = "'" + s;      // formula in’ektsiyasidan himoya
    return `"${s.replace(/"/g,'""')}"`; };
  const head = ["record_id","user_login","user_name","saved_at","deleted","date","athlete","sport","sex","age",
    "weight_kg","height_cm","body_fat_pct","phase","intensity","temperature","goal",
    "tdee_kcal","diet_kcal","AI","EDI","HSI","MRI"].concat(LABS.map(l=>"lab_"+l.id+(l.u?"_"+l.u.replace(/µ|μ/g,"u").replace(/[^\w]/g,""):"")));
  const L = [head.map(cell).join(",")];
  list.forEach(r=>{
    const a = (r.snapshot && r.snapshot.a) || {}, labs = (r.snapshot && r.snapshot.labs) || {}, ix = r.idx || {};
    L.push([r.id, r.owner, r.ownerName, r.savedAt, r.deleted?1:0, r.date, r.name, r.sport, r.sex, r.age,
      r.wt, a.ht, a.bf, a.phase, a.intens, a.temp, a.goal, r.tdee, r.kcal, ix.AI, ix.EDI, ix.HSI, ix.MRI]
      .concat(LABS.map(l=>labs[l.id])).map(cell).join(","));
  });
  return "\uFEFF" + L.join("\r\n");
}
function admStamp(){ return new Date().toISOString().slice(0,16).replace(/[:T]/g,"-"); }

function admWire(){
  if(ADM.wired) return; ADM.wired = true;
  $("#b-adm-refresh").addEventListener("click", ()=>admLoad(true));
  $("#adm-usearch").addEventListener("input", admDrawUsers);
  ["adm-q","adm-fuser","adm-fsport","adm-from","adm-to","adm-showdel"].forEach(id=>{
    const e = $("#"+id); const f = ()=>{ ADM.shown = 200; admDrawRecs(); };
    e.addEventListener("input", f); e.addEventListener("change", f);
  });
  $("#b-adm-csv").addEventListener("click", ()=>{
    const l = admFiltered();
    download(`food_calculator_archive_${admStamp()}.csv`, admCSV(l), "text/csv");
    admMsg(t("db.exported") + ": " + l.length);
  });
  $("#b-adm-json").addEventListener("click", ()=>{
    const l = admFiltered();
    download(`food_calculator_archive_${admStamp()}.json`, JSON.stringify({
      format:"food-calculator/archive", version:1, exported:new Date().toISOString(),
      by:AUTH.user.login, users:(ADM.data.users||[]), records:l}, null, 1), "application/json");
    admMsg(t("db.exported") + ": " + l.length);
  });
  $("#b-adm-backup").addEventListener("click", async e=>{
    const b = e.currentTarget; b.disabled = true; admMsg(t("adm.loading"));
    const r = await api("adminBackup");
    b.disabled = false;
    if(r.err){ admMsg(t(r.err)); return; }
    admMsg(t("adm.backupok") + " — " + t("adm.s.records") + ": " + n(r.backup.records));
    (ADM.data.backups = ADM.data.backups || []).unshift(r.backup);
    admDraw();
  });
  $("#adm-approval").addEventListener("change", async e=>{
    const on = e.target.checked;
    const r = await api("adminSetApproval", {on});
    if(r.err){ e.target.checked = !on; admMsg(t(r.err)); return; }
    ADM.data.requireApproval = r.requireApproval;
  });
}

document.addEventListener("click", e=>{
  const b = e.target.closest && e.target.closest('[data-tab="adm"]');
  if(b) admLoad(false);
});
/* tilni almashtirganda jadvallarni qayta chizish */
document.addEventListener("click", e=>{
  if(e.target && (e.target.id==="lang-uz" || e.target.id==="lang-en") && ADM.data) setTimeout(admDraw, 0);
});
</script>
