<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Calculator — sportchilar uchun individual ovqatlanish platformasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F171A; --ink2:#22343A; --ink3:#3B4F55;
  --paper:#E9ECE6; --card:#F7F8F4; --card2:#FDFDFB;
  --line:#C6CFC4; --line2:#DDE3D9;
  --acid:#D9A21B; --neutral:#1F8A5B; --base:#2A6BA8; --alarm:#AE3320;
  --mute:#6B7A78;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --cond:"IBM Plex Sans Condensed","Helvetica Neue",Arial,sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--serif); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--cond); font-weight:600; margin:0; line-height:1.15}
button,input,select,textarea{font:inherit; color:inherit}

.tblwrap{overflow-x:auto}
table.t.menu{font-size:12.5px;min-width:760px}
table.t.menu td{padding:4px 7px}
table.t.menu th{padding:6px 7px}
table.t.menu tr.mhead td{background:var(--ink2);color:#EDF0EA;font-family:var(--cond);
  font-weight:700;font-size:12px;letter-spacing:.06em;padding:7px}
table.t.menu tr.mhead .tag{border-color:currentColor}
table.t.menu tr.dhead td{background:#E4E9E1;font-family:var(--cond);font-weight:600}
table.t.menu td.ing{padding-left:20px;color:var(--ink2)}
table.t.menu td.s{color:var(--mute)}
table.t.menu tr.dtot td{background:var(--ink);color:#F4F6F1;font-family:var(--mono);
  font-weight:600;border-top:2px solid var(--ink)}
@media print{table.t.menu{min-width:0;font-size:9.5px}
  table.t.menu tr.mhead td{background:#ddd;color:#000}
  table.t.menu tr.dtot td{background:#eee;color:#000}}

/* ---------- institutional band ---------- */
.instbar{background:var(--card2);border-bottom:1px solid var(--line)}
.instbar-in{max-width:1180px;margin:0 auto;padding:10px 22px;
  display:flex;gap:34px;align-items:center;flex-wrap:wrap}
.inst{display:flex;gap:11px;align-items:center;min-width:0}
.inst img{height:42px;width:auto;display:block;flex:0 0 auto}
.inst div{display:flex;flex-direction:column;min-width:0}
.inst b{font-family:var(--cond);font-size:12.5px;font-weight:700;letter-spacing:.02em;
  color:var(--ink);line-height:1.25}
.inst span{font-family:var(--cond);font-size:10.5px;letter-spacing:.05em;color:var(--mute);
  line-height:1.3;margin-top:1px}
@media(max-width:560px){.instbar-in{gap:16px}.inst img{height:34px}.inst b{font-size:11.5px}.inst span{font-size:9.5px}}

/* ---------- himoya: qulf, suv belgisi, hujjat identifikatori ---------- */
.lock{position:fixed;inset:0;z-index:9999;background:var(--ink);overflow:auto;
  display:flex;align-items:center;justify-content:center;padding:22px}
.lock[hidden]{display:none}
.lockbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:26px 28px 22px;max-width:420px;width:100%}
.lb-brand{border-bottom:1px solid var(--line2);padding-bottom:14px;margin-bottom:16px}
.lb-brand .eyebrow{font-family:var(--cond);text-transform:uppercase;letter-spacing:.2em;
  font-size:10px;color:#8A6608;font-weight:600;display:block;margin-bottom:4px}
.lb-brand h1{font-size:25px;letter-spacing:-.015em}
.lb-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:16px}
.lb-tabs button{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;
  cursor:pointer;padding:9px 4px;font-family:var(--cond);font-size:12px;font-weight:600;
  letter-spacing:.11em;text-transform:uppercase;color:var(--mute)}
.lb-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acid)}
.lockbox .field{margin-bottom:12px}
.lockbox .chk{display:flex;gap:8px;align-items:center;font-family:var(--cond);
  font-size:12.5px;color:var(--ink2);margin:4px 0 12px;cursor:pointer}
.lockbox .chk input{width:15px;height:15px;accent-color:var(--acid)}
.lockbox .err{color:var(--alarm);font-family:var(--cond);font-size:12.5px;min-height:18px;margin-bottom:6px}
.lb-note{font-family:var(--cond);font-size:11px;line-height:1.5;color:var(--mute);
  margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line2)}

.userchip{display:flex;gap:10px;align-items:center;padding-right:4px}
.userchip .uc-t{display:flex;flex-direction:column;line-height:1.2;text-align:right;min-width:0}
.userchip b{font-family:var(--cond);font-size:12px;color:#F4F6F1;font-weight:600}
.userchip span{font-family:var(--mono);font-size:10px;color:#93A5A3}
.userchip .btn.ghost{color:#C6D2CF;border-color:#3B4F55}
.userchip .btn.ghost:hover{background:#22343A}

.rec{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  border:1px solid var(--line2);border-radius:var(--r);background:var(--card2);
  padding:10px 12px;margin-bottom:8px}
.rec .r1{font-family:var(--cond);font-weight:600;font-size:13.5px}
.rec .r2{font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:2px}
.rec .acts{display:flex;gap:6px}

.docid{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.04em}
.wm{display:none}
@media print{
  .wm{display:block;position:fixed;inset:0;z-index:-1;pointer-events:none}
  .wm span{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) rotate(-28deg);
    font-family:var(--cond);font-size:52px;font-weight:700;letter-spacing:.14em;
    color:rgba(15,23,26,.055);white-space:nowrap;text-transform:uppercase}
  .prfoot{display:block !important;border-top:1px solid #999;margin-top:14px;padding-top:6px;
    font-family:var(--mono);font-size:9.5px;color:#444}
}
.prfoot{display:none}

/* ---------- shell ---------- */
.masthead{
  background:var(--ink); color:#E9ECE6;
  border-bottom:3px solid var(--acid);
}
.masthead-in{max-width:1180px;margin:0 auto;padding:18px 22px 14px;
  display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
.brand{flex:1 1 340px;min-width:0}
.brand .eyebrow{
  font-family:var(--cond); text-transform:uppercase; letter-spacing:.20em;
  font-size:10.5px; color:var(--acid); font-weight:600; display:block; margin-bottom:5px;
}
.brand h1{font-size:30px; letter-spacing:-.015em; color:#F4F6F1}
.brand .sub{font-family:var(--cond); font-size:12.5px; color:#93A5A3; margin-top:4px; letter-spacing:.01em}
.mast-tools{display:flex;gap:8px;align-items:center;padding-bottom:4px}

.langsw{display:inline-flex;border:1px solid #3B4F55;border-radius:var(--r);overflow:hidden}
.langsw button{
  background:transparent;color:#93A5A3;border:0;cursor:pointer;
  font-family:var(--cond);font-size:11px;font-weight:600;letter-spacing:.12em;
  padding:6px 11px;text-transform:uppercase;
}
.langsw button[aria-pressed="true"]{background:var(--acid);color:var(--ink)}

/* ---------- tabs ---------- */
.tabbar{background:var(--ink2);border-bottom:1px solid #16232700}
.tabbar-in{max-width:1180px;margin:0 auto;padding:0 22px;display:flex;gap:0;overflow-x:auto}
.tabbar button{
  background:transparent;border:0;border-bottom:3px solid transparent;cursor:pointer;
  color:#9FB1AE;font-family:var(--cond);font-size:12px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;padding:12px 15px;white-space:nowrap;
}
.tabbar button:hover{color:#E9ECE6}
.tabbar button[aria-selected="true"]{color:#fff;border-bottom-color:var(--acid)}

main{max-width:1180px;margin:0 auto;padding:24px 22px 80px}
.panel[hidden]{display:none}

/* ---------- layout ---------- */
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
@media(max-width:900px){.g2,.g3,.g-side{grid-template-columns:1fr}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.card>header{
  border-bottom:1px solid var(--line2);padding:11px 16px;
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;
}
.card>header h2,.card>header h3{
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink2);
}
.card>header .note{font-family:var(--mono);font-size:10.5px;color:var(--mute)}
.card .body{padding:16px}
.card .body.tight{padding:12px 16px}

/* ---------- fields ---------- */
.fields{display:grid;gap:12px 14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fields.f3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fields.f1{grid-template-columns:1fr}
@media(max-width:640px){.fields,.fields.f3{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{
  font-family:var(--cond);font-size:10.5px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink3);
}
.field .unit{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:0;text-transform:none}
.field input,.field select{
  background:var(--card2);border:1px solid var(--line);border-radius:var(--r);
  padding:8px 9px;font-family:var(--mono);font-size:14px;width:100%;
}
.field input:focus,.field select:focus{outline:2px solid var(--base);outline-offset:-1px;border-color:var(--base)}
.field .ref{font-family:var(--mono);font-size:10px;color:var(--mute)}
.field.flag input{border-color:var(--acid);background:#FDF7E7}
.field.flag-bad input{border-color:var(--alarm);background:#FBEFEC}

.btn{
  background:var(--ink);color:#F4F6F1;border:1px solid var(--ink);border-radius:var(--r);
  font-family:var(--cond);font-size:12px;font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;padding:9px 16px;cursor:pointer;
}
.btn:hover{background:var(--ink2)}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line)}
.btn.ghost:hover{background:#E2E7DE}
.btn.acc{background:var(--acid);border-color:var(--acid);color:#1A1205}
.btn.acc:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:11px;letter-spacing:.08em}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- 1440 dial (signature) ---------- */
.dialwrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.dial{position:relative;width:168px;height:168px;flex:0 0 auto}
.dial svg{transform:rotate(-90deg);display:block}
.dial .readout{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
}
.dial .readout .big{font-family:var(--mono);font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1}
.dial .readout .lab{font-family:var(--cond);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-top:5px}
.dial .readout .delta{font-family:var(--mono);font-size:11px;margin-top:3px}
.dial-legend{flex:1 1 200px;min-width:0}

/* ---------- activity rows ---------- */
.acts{width:100%;border-collapse:collapse}
.acts th{
  font-family:var(--cond);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600;
}
.acts td{padding:4px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.acts td.n{font-family:var(--mono);font-size:12.5px;text-align:right;white-space:nowrap}
.acts select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:6px 7px;font-family:var(--cond);font-size:13px}
.acts input[type=number]{width:74px;background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:6px 7px;font-family:var(--mono);font-size:13px;text-align:right}
.acts tfoot td{font-family:var(--mono);font-weight:600;border-top:2px solid var(--ink);border-bottom:0;padding-top:9px}
.xbtn{background:transparent;border:1px solid var(--line);border-radius:var(--r);color:var(--mute);cursor:pointer;width:26px;height:26px;line-height:1;font-size:15px;padding:0}
.xbtn:hover{border-color:var(--alarm);color:var(--alarm)}

/* ---------- index readout panel ---------- */
.readpanel{background:var(--ink);border-radius:var(--r);padding:16px;color:#E9ECE6}
.readpanel h3{color:#93A5A3;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:12px}
.idxrow{display:grid;grid-template-columns:1fr 54px;gap:10px;align-items:center;margin-bottom:13px}
.idxrow .nm{font-family:var(--cond);font-size:12.5px;letter-spacing:.03em;color:#C6D2CF}
.idxrow .bar{grid-column:1/-1;height:7px;background:#22343A;border-radius:1px;overflow:hidden;position:relative}
.idxrow .bar i{display:block;height:100%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.idxrow .v{font-family:var(--mono);font-size:17px;font-weight:600;text-align:right}
.idxrow .cat{grid-column:1/-1;font-family:var(--mono);font-size:10.5px;color:#8FA09D;margin-top:-3px}

/* ---------- pH strip ---------- */
.phstrip{position:relative;height:34px;border-radius:2px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(90deg,#D9A21B 0%,#C9B419 22%,#5E9B36 44%,#1F8A5B 56%,#2A8FA8 74%,#2A6BA8 100%)}
.phstrip .marker{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ink);
  box-shadow:0 0 0 1.5px #fff;transition:left .5s cubic-bezier(.2,.8,.2,1)}
.phscale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--mute);margin-top:4px}

/* ---------- stat blocks ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:1px;background:var(--line2);border:1px solid var(--line2)}
.stat{background:var(--card2);padding:11px 13px}
.stat .k{font-family:var(--cond);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}
.stat .v{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.stat .v small{font-size:11px;font-weight:400;color:var(--mute);letter-spacing:0}
.stat .x{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:1px}

/* ---------- macro bar ---------- */
.macrobar{display:flex;height:26px;border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.macrobar div{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:#fff}
.mb-p{background:var(--alarm)} .mb-f{background:var(--acid);color:#1A1205 !important} .mb-c{background:var(--base)}

/* ---------- generic table ---------- */
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-family:var(--cond);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  text-align:left;padding:8px;border-bottom:1.5px solid var(--ink2);color:var(--ink2);font-weight:700}
table.t td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
table.t tbody tr:last-child td{border-bottom:0}
table.t .ph{font-family:var(--cond);font-weight:600;font-size:13px}

.tag{display:inline-block;font-family:var(--cond);font-size:10px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;padding:2px 7px;border-radius:9px;border:1px solid}
.tag.ok{color:var(--neutral);border-color:var(--neutral);background:#E8F4EE}
.tag.warn{color:#8A6608;border-color:var(--acid);background:#FBF3DF}
.tag.bad{color:var(--alarm);border-color:var(--alarm);background:#F9EBE8}
.tag.info{color:var(--base);border-color:var(--base);background:#E8EFF7}

.rx{border-left:3px solid var(--base);background:var(--card2);padding:11px 14px;margin:0 0 10px}
.rx.warn{border-left-color:var(--acid)}
.rx.bad{border-left-color:var(--alarm)}
.rx.ok{border-left-color:var(--neutral)}
.rx .h{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.rx p{margin:0;font-size:13.5px}

.empty{font-family:var(--cond);color:var(--mute);font-size:13.5px;padding:26px 0;text-align:center}
.hint{font-size:12.5px;color:var(--mute);font-family:var(--cond);margin-top:6px}
.mono{font-family:var(--mono)}
.sechead{font-family:var(--cond);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3);margin:22px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.sechead:first-child{margin-top:0}
.docref{font-family:var(--mono);font-size:10.5px;color:var(--mute);border-left:2px solid var(--line);padding-left:8px;margin-top:8px}

/* algorithm flow */
.flow{display:grid;gap:10px}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;background:var(--card2);border:1px solid var(--line2);
  border-radius:var(--r);padding:12px 14px}
.step .num{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--acid);border-right:1px solid var(--line2);
  padding-right:10px}
.step h4{font-size:13px;letter-spacing:.03em;margin-bottom:3px}
.step p{margin:0;font-size:13px;color:var(--ink2)}
.step code{font-family:var(--mono);font-size:12px;background:#E4E9E1;padding:1px 5px;border-radius:2px}

.foot{max-width:1180px;margin:0 auto;padding:0 22px 40px;font-family:var(--cond);font-size:11.5px;color:var(--mute)}

@media print{
  body{background:#fff}
  .masthead,.tabbar,.noprint{display:none !important}
  .instbar{border-bottom:1px solid #999}
  .instbar-in{padding:0 0 8px}
  main{max-width:none;padding:0}
  .panel[hidden]{display:block !important}
  .panel{break-before:page}
  .panel:first-of-type{break-before:auto}
  .card{break-inside:avoid;border-color:#999}
  .readpanel{background:#fff;color:#000;border:1px solid #999}
  .readpanel h3,.idxrow .nm,.idxrow .cat{color:#333}
  .idxrow .bar{background:#ddd}
}
/* ---------- server rejimi: rozilik, admin arxivi ---------- */
.lockbox [hidden]{display:none !important}
.lockbox .err.okmsg{color:var(--neutral)}
.lockbox .chk.consent{align-items:flex-start;line-height:1.45}
.lockbox .chk.consent input{margin-top:2px;flex:0 0 auto}
.lockbox button[disabled]{opacity:.6;cursor:progress}
.modechip{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.04em;
  padding:2px 6px;border:1px solid var(--line);border-radius:var(--r);color:var(--mute);margin-top:10px}
.modechip.on{color:var(--neutral);border-color:var(--neutral)}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
a.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.userchip .admtag{font-family:var(--cond);font-size:9.5px;font-weight:700;letter-spacing:.12em;
  color:var(--acid);text-transform:uppercase}
.tabbar button.admtab{color:#E7C66A}
.tabbar button[hidden]{display:none}
.adm-stack{display:grid;gap:18px}
.adm-filters{display:grid;gap:10px 12px;grid-template-columns:2fr 1.4fr 1fr 1fr 1fr;align-items:end;margin-bottom:12px}
.adm-filters .field{margin:0}
.adm-filters .chk{display:flex;gap:7px;align-items:center;font-family:var(--cond);font-size:12.5px;color:var(--ink2);cursor:pointer}
@media(max-width:900px){.adm-filters{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.adm-filters{grid-template-columns:1fr}}
.adm-filters input,.adm-filters select,.adm-search{width:100%;background:var(--card2);border:1px solid var(--line);
  border-radius:var(--r);padding:7px 9px;font-family:var(--mono);font-size:12.5px}
table.t.adm{font-size:12.5px;min-width:860px}
table.t.adm td{padding:6px 8px;vertical-align:middle}
table.t.adm td.u b{font-family:var(--cond);font-weight:600;display:block}
table.t.adm td.u span{font-family:var(--mono);font-size:10.5px;color:var(--mute)}
table.t.adm tr.del td{opacity:.55}
table.t.adm td.a{white-space:nowrap;text-align:right}
table.t.adm td.a .btn{margin-left:4px}
.adm-more{text-align:center;margin-top:10px}
.bk{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line2);padding:7px 0;
  font-family:var(--mono);font-size:11.5px}
.bk:last-child{border-bottom:0}
.bk a{color:var(--base)}
.adm-toggle{display:flex;gap:9px;align-items:flex-start;font-family:var(--cond);font-size:13px;cursor:pointer;line-height:1.4}
.adm-toggle input{width:16px;height:16px;accent-color:var(--acid);margin-top:2px}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="lock" id="lock" hidden>
  <div class="lockbox">
    <div class="lb-brand">
      <span class="eyebrow" data-i18n="brand.eyebrow"></span>
      <h1>Food Calculator</h1>
    </div>
    <div class="lb-tabs" role="tablist">
      <button id="au-tab-in" aria-selected="true" data-i18n="auth.signin"></button>
      <button id="au-tab-up" aria-selected="false" data-i18n="auth.signup"></button>
    </div>

    <div class="field"><label data-i18n="auth.login"></label>
      <input id="au-login" type="text" autocomplete="username" placeholder="ism@pochta.uz  /  +998 90 123 45 67">
      <span class="ref" data-i18n="auth.loginhint"></span></div>

    <div class="field au-up" hidden><label data-i18n="auth.name"></label>
      <input id="au-name" type="text" autocomplete="name" placeholder="—"></div>

    <div class="field au-up" hidden><label data-i18n="auth.role"></label>
      <select id="au-role">
        <option value="athlete" data-i18n="role.athlete"></option>
        <option value="coach" data-i18n="role.coach"></option>
        <option value="medic" data-i18n="role.medic"></option>
        <option value="inst" data-i18n="role.inst"></option>
        <option value="other" data-i18n="role.other"></option>
      </select></div>

    <div class="field"><label data-i18n="auth.pw"></label>
      <input id="au-pw" type="password" autocomplete="current-password" placeholder="••••••••"></div>

    <div class="field au-up" hidden><label data-i18n="auth.pw2"></label>
      <input id="au-pw2" type="password" autocomplete="new-password" placeholder="••••••••"></div>

    <label class="chk consent au-consent" hidden><input id="au-consent" type="checkbox">
      <span data-i18n="auth.consent"></span></label>

    <label class="chk"><input id="au-remember" type="checkbox" checked>
      <span data-i18n="auth.remember"></span></label>

    <div class="err" id="au-err"></div>
    <button class="btn acc" id="au-go" style="width:100%" data-i18n="auth.signin"></button>
    <p class="lb-note" id="au-note"></p>
    <span class="modechip" id="au-mode"></span>
  </div>
</div>

<div class="wm" aria-hidden="true"><span id="wm-text"></span></div>

"use strict";

/* ---------- yordamchi funksiyalar ---------- */
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const n = (v,d=0)=>(v==null||isNaN(v))?"—":Number(v).toLocaleString(LANG?"en-US":"uz-UZ",
  {minimumFractionDigits:d,maximumFractionDigits:d});
const r5 = v => Math.max(5, Math.round(v/5)*5);
const num = el => { const v = parseFloat(String(el.value).replace(",", ".")); return isFinite(v)?v:null; };

/* ---------- global holat ---------- */
const S = {
  a:{}, acts:[], labs:{}, out:null, menu:null, menuDay:0
};

/* =====================================================================
   BLOK A — bazal metabolizm
   ===================================================================== */
function calcBMR(a){
  if(a.bf && a.bf>2 && a.bf<60){
    const lbm = a.wt*(1-a.bf/100);
    return {v:370 + 21.6*lbm, eq:"Katch–McArdle", lbm};
  }
  const v = 10*a.wt + 6.25*a.ht - 5*a.age + (a.sex==="m" ? 5 : -161);
  return {v, eq:"Mifflin–St Jeor", lbm:null};
}

/* =====================================================================
   BLOK B — sutkalik energiya sarfi (3.16-jadval usuli)
   Faoliyat energiyasi = koeffitsient × tana vazni × vaqt(daq.)
   ===================================================================== */
const TEF = 1.10;   // ovqatning termik effekti (10–12 %)
const NEAT = 1.05;  // spontan faollik / mikrofaollik korreksiyasi

function calcTDEE(a, acts){
  let min=0, kgkcal=0, trainMin=0;
  const rows = acts.map(r=>{
    const act = ACTMAP[r.id]; if(!act) return null;
    const kk = act.c * r.min;                 // kkal/kg
    min += r.min; kgkcal += kk;
    if(act.c >= 0.09) trainMin += r.min;      // mashg‘ulot darajasidagi yuklama
    return {act, min:r.min, kgkcal:kk, kcal:kk*a.wt};
  }).filter(Boolean);

  const activity = kgkcal * a.wt;             // faoliyatga sarflangan umumiy energiya
  const tef = activity*(TEF-1);
  const neat = activity*TEF*(NEAT-1);
  const total = activity*TEF*NEAT;
  return {rows, min, kgkcal, activity, tef, neat, total, trainMin,
          trainH:trainMin/60, complete:Math.round(min)===1440, delta:min-1440};
}

/* =====================================================================
   BLOK C — normadan og‘ish va indekslar
   ===================================================================== */
function deviation(lab, v){
  if(v==null) return null;
  const hw = (lab.hi-lab.lo)/2;
  let d=0, side="in";
  if(v < lab.lo){ d=(lab.lo-v)/hw; side="lo"; }
  else if(v > lab.hi){ d=(v-lab.hi)/hw; side="hi"; }
  return {d:clamp(d,0,3), side, v};
}

function idxCategory(x){
  if(x<20) return {k:"ok",  uz:"past",           en:"low"};
  if(x<40) return {k:"ok",  uz:"o‘rtacha past",  en:"mild"};
  if(x<60) return {k:"warn",uz:"o‘rtacha",       en:"moderate"};
  if(x<80) return {k:"bad", uz:"yuqori",         en:"high"};
  return       {k:"bad", uz:"juda yuqori",    en:"very high"};
}

function calcIndices(L){
  /* --- C1. Metabolik atsidoz indeksi --- */
  const fa=[];
  if(L.ph  !=null) fa.push([0.45, clamp((7.40-L.ph)/0.10, 0, 1)]);
  if(L.lac !=null) fa.push([0.30, clamp((L.lac-2.2)/6.0, 0, 1)]);
  if(L.hco3!=null) fa.push([0.25, clamp((24-L.hco3)/8.0, 0, 1)]);
  const AI = fa.length ? 100*fa.reduce((s,[w,f])=>s+w*f,0)/fa.reduce((s,[w])=>s+w,0) : null;

  /* --- C2. Elektrolit disbalansi indeksi --- */
  const fe=[];
  LABS.filter(l=>l.grp==="elec").forEach(l=>{
    const dv = deviation(l, L[l.id]); if(!dv) return;
    fe.push([l.w, clamp(dv.d/2, 0, 1)]);
  });
  const EDI = fe.length ? 100*fe.reduce((s,[w,f])=>s+w*f,0)/fe.reduce((s,[w])=>s+w,0) : null;

  /* --- C3. Gormonal stress indeksi --- */
  const fh=[];
  if(L.cort!=null) fh.push([0.45, clamp((L.cort-LABMAP.cort.hi)/(LABMAP.cort.hi*0.6),0,1)]);
  if(L.ald !=null) fh.push([0.30, clamp((L.ald -LABMAP.ald.hi )/(LABMAP.ald.hi *0.6),0,1)]);
  if(L.ins !=null){ const dv=deviation(LABMAP.ins,L.ins); fh.push([0.25, clamp(dv.d/2,0,1)]); }
  const HSI = fh.length ? 100*fh.reduce((s,[w,f])=>s+w*f,0)/fh.reduce((s,[w])=>s+w,0) : null;

  /* --- C4. Umumiy metabolik xavf profili --- */
  const parts=[[0.40,AI],[0.35,EDI],[0.25,HSI]].filter(p=>p[1]!=null);
  const MRI = parts.length ? parts.reduce((s,[w,v])=>s+w*v,0)/parts.reduce((s,[w])=>s+w,0) : null;

  return {AI, EDI, HSI, MRI};
}

/* =====================================================================
   BLOK D — makronutrientlar (4.2, uchinchi bosqich)
   ===================================================================== */
function calcMacros(a, tdee, idx){
  const sp = SPORTS[a.sport];
  const kcal = tdee.total * PHASES[a.phase].k * GOALS[a.goal].k;
  const AI = idx.AI ?? 0;

  let pk = sp.p;
  if(AI >= 40) pk *= 0.90;              // kislota yuklamasini cheklash
  if(AI >= 65) pk *= 0.95;
  if(a.goal === "cut") pk *= 1.15;      // vazn kamaytirishda mushakni saqlash
  if(a.intens === 3)  pk *= 1.05;
  pk = clamp(pk, 1.4, 2.4);

  let fk = sp.f;
  if(a.goal === "cut") fk *= 0.88;
  fk = clamp(fk, 0.7, 1.4);

  let P = pk*a.wt, F = fk*a.wt;
  let C = (kcal - 4*P - 9*F)/4;
  let note = null;

  /* uglevod pastki chegarasi — sport turiga bog‘liq */
  const cmin = sp.cmin*a.wt*(a.goal==="cut"?0.8:1);
  if(C < cmin){
    const need = (cmin - C)*4;
    const fCut = Math.min(need/9, F - 0.7*a.wt);   // avval yog‘dan
    F -= Math.max(0,fCut);
    C = (kcal - 4*P - 9*F)/4;
    if(C < cmin){
      const pCut = Math.min((cmin-C)*4/4, P - 1.4*a.wt);
      P -= Math.max(0,pCut);
      C = (kcal - 4*P - 9*F)/4;
      note = "carblow";
    }
  }
  P=Math.max(0,P); F=Math.max(0,F); C=Math.max(0,C);
  const kc = Math.max(1, 4*P+9*F+4*C);
  return {kcal, P, F, C, pk:P/a.wt, fk:F/a.wt, ck:C/a.wt,
          pPct:400*P/kc, fPct:900*F/kc, cPct:400*C/kc, note};
}

/* =====================================================================
   BLOK E — mineral / mikroelement ehtiyoji va kislota-ishqor maqsadi
   ===================================================================== */
const SWEAT = {1:0.8, 2:1.2, 3:1.6};   // L/soat, iqlimga qarab

function calcMinerals(a, tdee, L, idx){
  const low = id => { const d=deviation(LABMAP[id], L[id]); return d && d.side==="lo" && d.d>0; };
  const th = tdee.trainH, AI = idx.AI ?? 0;
  /* ter yo‘qotilishi yuklama jadalligiga ham bog‘liq: MET 8 — bazaviy daraja */
  const trRows = tdee.rows.filter(r=>r.act.c>=0.09);
  const trMET  = trRows.length
    ? 60*trRows.reduce((s,r)=>s+r.act.c*r.min,0)/trRows.reduce((s,r)=>s+r.min,0) : 8;
  const sweat = th * SWEAT[a.temp] * clamp(trMET/8, 0.6, 1.4);   // L/kun

  const m = {
    mg:{base:a.sex==="m"?400:330, add:60*th + (low("mg")?120:0), cap:750, u:"mg"},
    k :{base:3500,               add:400*th + (low("k") ?600:0) + (AI>=40?400:0), cap:5800, u:"mg"},
    ca:{base:1200,               add:(low("ca")?300:0),          cap:1800, u:"mg"},
    fe:{base:a.sex==="m"?10:18,  add:(low("fe")?(a.sex==="m"?6:10):0), cap:32, u:"mg"},
    zn:{base:a.sex==="m"?11:8,   add:(low("zn")?5:0),            cap:25, u:"mg"},
    na:{base:2000,               add:700*sweat,                  cap:6000, u:"mg"}
  };
  Object.values(m).forEach(x=>{ x.v = Math.min(x.cap, x.base + x.add); });

  const pralTarget = AI>=65 ? -25 : AI>=40 ? -15 : 0;
  const alkShare  = AI>=65 ? 75 : AI>=40 ? 65 : 55;
  return {m, sweat, pralTarget, alkShare, low, trMET};
}

/* Ovqat tolasi me’yori — SanQvaN 0096-25 raqamli qiymat bermaydi
   (17-band nonushtada, 25-band tushlikda tolaga boy mahsulotlarni talab
   qiladi). Miqdor 1000 kkal uchun 14 g nisbatida hisoblanadi;
   qulaylik shifti ham energiyaga mutanosib o‘sadi, chunki 4000 kkal
   ratsionda tolani 45 g da ushlab turish amalda mumkin emas. */
function calcFibre(kcal){
  const v = clamp(Math.round(14*kcal/1000), 25, 50);
  return {v, base:25, hi:Math.max(45, Math.round(v*1.45))};
}

function calcFluid(a, tdee, mins, idx){
  const base = 35*a.wt;                        // ml/kun
  const repl = mins.sweat*1000*1.4;            // yo‘qotishning 140 % i
  const total = base + repl;
  const alkWater = (idx.AI??0) >= 40 ? ((idx.AI>=65)?1500:1000) : 500;
  const during = tdee.trainH>0 ? Math.round(mins.sweat*1000*0.75) : 0;
  return {base, repl, total, alkWater, during,
          duringRate: tdee.trainH>0 ? Math.round(during/tdee.trainH/50)*50 : 0,
          cho_h: tdee.trainMin>60 ? (tdee.trainMin>120?60:40) : 0,
          na_l: 500 + (a.temp===3?300:a.temp===2?150:0)};
}

/* =====================================================================
   BLOK F — tavsiya generatsiyasi (4.1, uchinchi modul)
   ===================================================================== */
function buildRx(a, idx, mins, mac, tdee, fl, L, fib){
  const R=[]; const AI=idx.AI??0, EDI=idx.EDI??0, HSI=idx.HSI??0;
  const P=(k,uz,en)=>R.push({k,uz,en});

  if(fib) P("info","Ovqat tolasi me’yori — "+n(fib.v)+" g/kun. SanQvaN 0096-25 tolaning raqamli me’yorini bermaydi (17- va 25-bandlar faqat tolaga boy mahsulotlarni talab qiladi); miqdor 1000 kkal uchun 14 g nisbatida hisoblandi. Asosiy manbalar: mosh, no‘xat, yasmiq, javdar noni, bug‘doy yormasi, ko‘katlar, anor, quritilgan meva. Musobaqa oldidan oxirgi 24 soatda tola miqdori 20–25 g gacha kamaytiriladi.",
    "Dietary fibre target — "+n(fib.v)+" g/day. SanQvaN 0096-25 gives no numeric fibre norm (items 17 and 25 only require fibre-rich foods); the figure is derived at 14 g per 1000 kcal. Main sources: mung beans, chickpeas, lentils, rye bread, bulgur, herbs, pomegranate, dried fruit. In the final 24 h before competition, reduce fibre to 20–25 g.");
  if(idx.AI==null) P("info","Kislota–ishqor ko‘rsatkichlari kiritilmagan — ratsion faqat energetik balansga qaratilgan adaptiv model bo‘yicha shakllantirildi.",
    "Acid–base indicators are absent — the ration was built on the energy-balance adaptive model only.");
  else if(AI>=65) P("bad","Og‘ir metabolik atsidoz. Ratsionda alkalogen mahsulotlar ulushi "+mins.alkShare+" % gacha oshiriladi; PRAL maqsadi ≤ "+mins.pralTarget+" mEq/kun. Bikarbonatga boy mineral suv "+fl.alkWater+" ml/kun. Oqsil yuklamasi vaqtincha "+n(mac.pk,2)+" g/kg gacha cheklandi.",
    "Severe metabolic acidosis. Alkalogenic share raised to "+mins.alkShare+" %; PRAL target ≤ "+mins.pralTarget+" mEq/day. Bicarbonate-rich mineral water "+fl.alkWater+" ml/day. Protein load temporarily limited to "+n(mac.pk,2)+" g/kg.");
  else if(AI>=40) P("warn","O‘rtacha metabolik atsidoz. Sabzavot, ko‘kat va mevalar ulushi "+mins.alkShare+" % ga yetkaziladi, rafinatsiyalangan uglevodlar va ortiqcha qayta ishlangan oqsillar cheklanadi.",
    "Moderate metabolic acidosis. Vegetables, herbs and fruit raised to "+mins.alkShare+" %; refined carbohydrates and over-processed proteins restricted.");
  else if(AI>=20) P("warn","Atsidozning yengil belgilari. Mashg‘ulotdan keyingi 60 daqiqada alkalogen komponentlar va K⁺/Mg²⁺ ga boy ichimliklar ustuvor.",
    "Mild acidosis signs. Alkalogenic components and K⁺/Mg²⁺-rich drinks prioritised in the first 60 min post-session.");
  else P("ok","Kislota–ishqor muvozanati barqaror. Ratsion energetik balansni saqlashga yo‘naltirilgan standart adaptiv model bo‘yicha shakllantirildi.",
    "Acid–base balance is stable. Standard adaptive energy-balance model applied.");

  if(mins.low("mg")) P("warn","Magniy taqchilligi: mushak relaksatsiyasi va ATF sintezi uchun sutkalik ehtiyoj "+n(mins.m.mg.v)+" mg ga oshirildi (bodom, yong‘oq, grechka, ismaloq, quritilgan anjir).",
    "Magnesium deficit: daily requirement raised to "+n(mins.m.mg.v)+" mg for muscle relaxation and ATP synthesis (almonds, walnuts, buckwheat, spinach, dried figs).");
  if(mins.low("k")) P("warn","Kaliy taqchilligi: "+n(mins.m.k.v)+" mg/kun. Kartoshka, quritilgan o‘rik, banan, ko‘katlar ustuvorlashtiriladi.",
    "Potassium deficit: "+n(mins.m.k.v)+" mg/day. Potatoes, dried apricots, bananas and herbs prioritised.");
  if(mins.low("ca")) P("warn","Kalsiy taqchilligi: "+n(mins.m.ca.v)+" mg/kun — nerv-mushak uzatilishini barqarorlashtirish uchun sut mahsulotlari va ko‘katlar ulushi oshiriladi.",
    "Calcium deficit: "+n(mins.m.ca.v)+" mg/day — dairy and herbs increased to stabilise neuromuscular transmission.");
  if(mins.low("fe")) P("bad","Temir taqchilligi: "+n(mins.m.fe.v,0)+" mg/kun. Qizil go‘sht, yasmiq, ko‘katlar; C vitamini bilan birga qabul qilish tavsiya etiladi, choy/qahva ovqatdan 1 soat ajratiladi.",
    "Iron deficit: "+n(mins.m.fe.v,0)+" mg/day. Red meat, lentils, herbs; combine with vitamin C and separate tea/coffee from meals by 1 h.");
  if(mins.low("zn")) P("warn","Rux taqchilligi: "+n(mins.m.zn.v,0)+" mg/kun — fermentativ regulyatsiya va immun javob uchun.",
    "Zinc deficit: "+n(mins.m.zn.v,0)+" mg/day — for enzymatic regulation and immune response.");
  if(L.na!=null && L.na<135) P("warn","Giponatriyemiya belgilari: mashg‘ulot davomida faqat suv emas, "+n(fl.na_l)+" mg/L natriy tutuvchi ichimlik qo‘llanadi.",
    "Signs of hyponatraemia: use a sodium-containing drink at "+n(fl.na_l)+" mg/L during sessions, not plain water.");

  if(HSI>=50) P("bad","Yuqori gormonal stress fon (kortizol/aldosteron). Uglevod ta’minoti mashg‘ulot atrofida zichlashtiriladi, uyqu ≥8 soat, tiklanish kunlari kiritiladi. Insulin sezuvchanligini saqlash uchun kechki ovqatda murakkab uglevodlar ustuvor.",
    "High hormonal stress load (cortisol/aldosterone). Concentrate carbohydrate around sessions, sleep ≥8 h, insert recovery days. Prioritise complex carbohydrates at dinner to preserve insulin sensitivity.");
  else if(HSI>=25) P("warn","O‘rtacha endokrin stress fon — mashg‘ulotdan keyingi uglevod-oqsil kombinatsiyasi kortizol javobini pasaytiradi.",
    "Moderate endocrine stress — post-session carbohydrate–protein combination attenuates the cortisol response.");

  if(EDI>=50) P("bad","Elektrolit disbalansi yuqori. Individual suyuqlik-elektrolit protokoli majburiy: mashg‘ulotdan oldin va keyin tana vaznini o‘lchash, har 1 kg yo‘qotishga 1.4 L suyuqlik.",
    "Electrolyte imbalance is high. An individual fluid–electrolyte protocol is mandatory: weigh before and after sessions, replace 1.4 L per 1 kg lost.");

  const sp=SPORTS[a.sport];
  if(sp.note==="protein") P("info","Og‘ir atletika: oqsil ulushi mushak regeneratsiyasini qo‘llab-quvvatlash uchun "+n(mac.pk,2)+" g/kg darajasida belgilandi, kunlik 4–5 martalik teng taqsimot bilan.",
    "Weightlifting: protein set at "+n(mac.pk,2)+" g/kg to support muscle regeneration, distributed evenly across 4–5 intakes.");
  if(sp.note==="carb") P("info","Futbol: energiya barqarorligi uchun murakkab uglevodlar ustuvor — "+n(mac.ck,1)+" g/kg, glikogen rezervini mashg‘ulot oldi va keyin to‘ldirish.",
    "Football: complex carbohydrates prioritised for energy stability — "+n(mac.ck,1)+" g/kg, replenishing glycogen before and after sessions.");
  if(sp.note==="balance") P("info","Muaytay: uglevod–oqsil muvozanati tez tiklanishga yo‘naltirildi ("+n(mac.ck,1)+" g/kg uglevod, "+n(mac.pk,2)+" g/kg oqsil), vazn toifasini nazorat qilish bilan.",
    "Muay Thai: carbohydrate–protein balance tuned for rapid recovery ("+n(mac.ck,1)+" g/kg CHO, "+n(mac.pk,2)+" g/kg protein) with weight-class control.");

  if(!tdee.complete) P("bad","Diqqat: kun tuzilishi 1440 daqiqaga teng emas ("+n(tdee.min)+" daq.). Energiya sarfi noto‘liq hisoblangan.",
    "Warning: the day structure does not sum to 1440 minutes ("+n(tdee.min)+" min). Energy expenditure is incomplete.");
  if(mac.note==="carblow") P("warn","Belgilangan kaloriyalilikda sport turi uchun minimal uglevod normasiga erishilmadi — kaloriyalilikni oshirish yoki yuklamani qayta ko‘rib chiqish tavsiya etiladi.",
    "The minimum carbohydrate norm for this sport was not reached at the set energy intake — increase energy or review the training load.");
  return R;
}

/* =====================================================================
   BLOK G — fazalar protokoli (3.17-jadval tuzilishi)
   ===================================================================== */
const DIST = {bfast:0.22, pre:0.18, post:0.15, lunch:0.25, dinner:0.20};

function buildPlan(a, mac, fl, mins, tdee){
  const preC = clamp((a.intens===3?1.5:a.intens===2?1.2:1.0)*a.wt, 0, mac.C*0.45);
  const postP = 0.3*a.wt, postC = 1.0*a.wt;
  return [
    {ph:"pre",  kcal:mac.kcal*DIST.pre,  P:mac.P*0.15, F:mac.F*0.10, C:preC},
    {ph:"dur",  kcal:tdee.trainMin>60 ? fl.cho_h*4*tdee.trainH : 0, P:0, F:0,
                C:tdee.trainMin>60 ? fl.cho_h*tdee.trainH : 0},
    {ph:"post", kcal:mac.kcal*DIST.post, P:postP, F:mac.F*0.10, C:postC},
    {ph:"day",  kcal:mac.kcal*(DIST.bfast+DIST.lunch+DIST.dinner), P:mac.P-postP-mac.P*0.15,
                F:mac.F*0.80, C:Math.max(0, mac.C-preC-postC)}
  ];
}

/* =====================================================================
   Yagona hisoblash sikli
   ===================================================================== */
function computeAll(){
  const a=S.a, L=S.labs;
  const bmr  = calcBMR(a);
  const tdee = calcTDEE(a, S.acts);
  const idx  = calcIndices(L);
  const mac  = calcMacros(a, tdee, idx);
  const mins = calcMinerals(a, tdee, L, idx);
  const fl   = calcFluid(a, tdee, mins, idx);
  const fib  = calcFibre(mac.kcal);
  const setId= S.setId || (a.age<14 ? "s11" : "s14");
  const grp  = sqGroupTargets(mac.kcal, setId);
  const rx   = buildRx(a, idx, mins, mac, tdee, fl, L, fib);
  const plan = buildPlan(a, mac, fl, mins, tdee);
  S.out = {bmr, tdee, idx, mac, mins, fl, fib, grp, setId, rx, plan};
  return S.out;
}

/* Menyu alohida hisoblanadi — u sportchi moduliga ham, mustaqil
   kaloriya rejimiga ham xizmat qiladi */
function computeMenu(kcal, days, opts){
  S.menu = buildSqMenu(kcal, days, opts);
  S.menuKcal = kcal;
  S.menuMac = sqMacros(kcal, opts.season);
  return S.menu;
}

const SET_KCAL = {non:239, un:334, yorma:340, shakar:399, asal:304, qandolat:450,
  saryog:748, oyog:899, sut:52, smetana:206, tvorog:121, pishloq:350, gosht:187,

function setKcal(setId){
  return Object.entries(SQ_SET[setId].it)
    .reduce((s,[k,v])=>s + (SET_KCAL[k]||0)*v/100, 0);
}
function sqGroupTargets(kcal, setId){
  const base = setGroups(setId), ref = setKcal(setId);
  const k = clamp(kcal/ref, 0.5, 2.0), o={};
  Object.entries(base).forEach(([g,v])=>o[g]=Math.round(v*k/10)*10);
  return o;
}

function sqMacros(kcal, mode){
  const [rp,rf,rc] = SQ.ratio[mode==="winter"?"winter":"std"];
  const per = 4*rp + 9*rf + 4*rc;          // 1 "oqsil ulushi" ga to‘g‘ri keladigan kkal
  const unit = kcal/per;
  return {P:rp*unit, F:rf*unit, C:rc*unit, ratio:[rp,rf,rc]};
}

/* Miqdorni oshxona amaliyotiga mos yaxlitlash */
function rnd(g){
  if(g < 3) return Math.round(g*10)/10;
  if(g < 20) return Math.round(g);
  return Math.round(g/5)*5;
}
const FIXED = ["tuz","suv","choy"];        // miqyoslanmaydigan pozitsiyalar

function dishRows(d, k){
  return d.it.map(([id,br])=>{
    const I = IMAP[id];
    const brutto = FIXED.includes(id) ? br : rnd(br*k);
    const netto  = Math.round(brutto*(1-I.w)*10)/10;
    const q = netto/100;
    return {id, I, brutto, netto,
      p:I.p*q, f:I.f*q, c:I.c*q, fib:I.fib*q, kcal:I.kcal*q, pral:I.pral*q,
      mg:I.mg*q, k:I.k*q, ca:I.ca*q, fe:I.fe*q, zn:I.zn*q, na:I.na*q,
      soum: brutto/1000*I.soum};
  });
}
const ZERO = ()=>({p:0,f:0,c:0,fib:0,kcal:0,pral:0,mg:0,k:0,ca:0,fe:0,zn:0,na:0,soum:0,brutto:0,netto:0});
function accum(T, r){ ["p","f","c","fib","kcal","pral","mg","k","ca","fe","zn","na","soum","brutto","netto"]
  .forEach(x=>T[x]+=r[x]||0); return T; }

/* Bir mahal uchun taomlarni tanlash — 13-band: hafta davomida bir xil
   taom takrorlanmasligi kerak, shu sababli har toifa uchun aylanma tanlov */
function pickDishes(slot, dayIdx, opts){
  const out=[];
  SQ.compose[slot].forEach((kind, ki)=>{
    let pool = DISH.filter(d=>d.slot.includes(slot) && d.kind===kind);
    if(opts.training) pool = pool.filter(d=>!(d.flags||[]).includes("meteorizm"));
    if(slot==="dn")   pool = pool.filter(d=>!(d.flags||[]).some(f=>f==="ogir"||f==="qovurma"));
    if(slot==="b1" && opts.dist==="morn")
      pool = pool.filter(d=>!["moshkichiri","zigir_p"].includes(d.id));
    if(!pool.length) return;
    out.push(pool[(dayIdx*(ki+2) + ki*3) % pool.length]);
  });
  return out;
}

function buildSqDay(dayIdx, kcal, opts){
  const dist = SQ.dist[opts.dist || "std"];
  const meals = SQ.slots.map(slot=>{
    const pct = dist[slot], target = kcal*pct/100;
    let chosen = pickDishes(slot, dayIdx, opts);
    const baseOf = list => list.reduce((s,d)=>s + dishRows(d,1).reduce((a,r)=>a+r.kcal,0), 0);
    /* Past kaloriyalilikda hamma porsiyani qisqartirgandan ko‘ra ixtiyoriy
       taomni (qo‘shimcha) olib tashlash amaliy jihatdan to‘g‘riroq */
    while(chosen.length > 2 && baseOf(chosen) > 0 && target/baseOf(chosen) < 0.6){
      const i = chosen.findIndex(d=>d.kind==="qoshimcha");
      if(i < 0) break;
      chosen = chosen.filter((_,j)=>j!==i);
    }
    const base = baseOf(chosen);
    const k = clamp(base>0 ? target/base : 1, 0.40, 2.5);
    const dishes = chosen.map(d=>{
      const rows = dishRows(d, k);
      const tot = rows.reduce((T,r)=>accum(T,r), ZERO());
      tot.portion = rows.filter(r=>r.id!=="suv" && r.id!=="tuz" && r.id!=="choy")
                        .reduce((s,r)=>s+r.netto,0);
      return {d, rows, tot};
    });
    const tot = dishes.reduce((T,x)=>accum(T,x.tot), ZERO());
    return {slot, pct, target, dishes, tot, fit:base>0 ? target/base : 1, k};
  });
  const tot = meals.reduce((T,m)=>accum(T,m.tot), ZERO());
  tot.groups = {};
  meals.forEach(m=>m.dishes.forEach(x=>x.rows.forEach(r=>{
    tot.groups[r.I.grp] = (tot.groups[r.I.grp]||0) + r.brutto; })));
  return {meals, tot};
}

function buildSqMenu(kcal, days, opts){
  return Array.from({length:days}, (_,i)=>buildSqDay(i, kcal, opts));
}

/* SanQvaN qoidalariga muvofiqlik nazorati */
function sqCheck(day, kcal, mac, setId, regime){
  const out=[], T=day.tot;
  const RG = SQ.rangeBy[regime||"std"] || SQ.range;
  const add=(k,band,uz,en)=>out.push({k,band,uz,en});

  day.meals.forEach(m=>{
    const pct = 100*m.tot.kcal/Math.max(T.kcal,1), r=RG[m.slot];
    if(pct < r[0]-2 || pct > r[1]+2)
      add(pct<r[0] ? "warn":"warn", "37",
        SQ.name[m.slot][0]+" ulushi "+pct.toFixed(1)+" % — me’yor "+r[0]+"–"+r[1]+" %.",
        SQ.name[m.slot][1]+" share is "+pct.toFixed(1)+" % — norm "+r[0]+"–"+r[1]+" %.");
  });

  const rp=T.p, rf=T.f/Math.max(rp,1), rc=T.c/Math.max(rp,1);
  if(rf<0.75 || rf>0.95 || rc<3.4 || rc>4.6)
    add("warn","7","Oqsil : yog‘ : uglevod nisbati 1 : "+rf.toFixed(2)+" : "+rc.toFixed(2)+
      " — me’yor 1 : (0,8–0,9) : (3,5–4,5).",
      "Protein : fat : carbohydrate is 1 : "+rf.toFixed(2)+" : "+rc.toFixed(2)+
      " — norm 1 : (0.8–0.9) : (3.5–4.5).");
  else add("ok","7","Oqsil : yog‘ : uglevod nisbati 1 : "+rf.toFixed(2)+" : "+rc.toFixed(2)+" — me’yorga muvofiq.",
      "Protein : fat : carbohydrate is 1 : "+rf.toFixed(2)+" : "+rc.toFixed(2)+" — within the norm.");

  const oilRow = day.meals.flatMap(m=>m.dishes).flatMap(x=>x.rows).filter(r=>r.id==="oyog");
  const oil = oilRow.reduce((s,r)=>s+r.brutto,0);
  const oilNorm = setId==="s11" ? SQ.oil.u14 : SQ.oil.o14;
  if(oil < oilNorm*0.7)
    add("warn","18","O‘simlik yog‘i "+Math.round(oil)+" g — me’yor "+oilNorm+" g (rafinadlanmagan, paxta yog‘idan tashqari).",
      "Vegetable oil "+Math.round(oil)+" g — norm "+oilNorm+" g (unrefined, cottonseed oil excluded).");

  const b1 = day.meals.find(m=>m.slot==="b1");
  const animal = b1 ? b1.dishes.some(x=>x.rows.some(r=>r.I.grp==="mt"||r.I.grp==="mk")) : false;
  add(animal?"ok":"warn","19",
    animal ? "Nonushtada hayvon oqsiliga boy taom mavjud." : "Nonushtada hayvon oqsiliga boy taom yo‘q.",
    animal ? "Breakfast contains an animal-protein dish." : "Breakfast lacks an animal-protein dish.");

  const dn = day.meals.find(m=>m.slot==="dn");
  if(dn && dn.tot.f > (b1?b1.tot.f:0))
    add("warn","29","Kechki ovqatdagi yog‘ miqdori nonushtadagidan ko‘p — 29-band bo‘yicha kamroq bo‘lishi kerak.",
      "Fat at dinner exceeds breakfast — item 29 requires it to be lower.");

  const n2 = day.meals.find(m=>m.slot==="n2");
  const dairy = n2 ? n2.dishes.some(x=>x.rows.some(r=>r.I.grp==="mk")) : false;
  add(dairy?"ok":"warn","32",
    dairy ? "Ikkinchi kechki taomda oqsilga boy sut mahsuloti berilgan." : "Ikkinchi kechki taomda sut mahsuloti yo‘q.",
    dairy ? "The second supper includes a protein-rich dairy item." : "The second supper lacks a dairy item.");

  const grp = day.tot.groups||{};
  const need = ["gr","vg","fr","mk","mt","ft"];
  const miss = need.filter(g=>!(grp[g]>0));
  if(miss.length) add("bad","12",
    "12-band: kunlik ratsionda yetishmayotgan guruhlar — "+miss.map(g=>GRP_NAME[g][0]).join(", ")+".",
    "Item 12: groups missing from the daily ration — "+miss.map(g=>GRP_NAME[g][1]).join(", ")+".");
  else add("ok","12","12-band: barcha majburiy oziq-ovqat guruhlari ratsionda mavjud.",
    "Item 12: all required food groups are present in the ration.");
  return out;
}

/* ---------- compact SHA-256 (crypto.subtle mavjud bo‘lmagan holatlar uchun ham) ---------- */
const SHA256 = (()=>{
  const K=[];
  (function(){ let n=2,i=0;
    const isP=x=>{for(let d=2;d*d<=x;d++) if(x%d===0) return false; return true;};
    while(i<64){ if(isP(n)){ K.push((Math.pow(n,1/3)%1*0x100000000)|0); i++; } n++; } })();
  const H0=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const rr=(x,n)=>(x>>>n)|(x<<(32-n));
  return function(bytes){
    const l=bytes.length, bl=l*8;
    const withPad=new Uint8Array((((l+9)>>6)+1)<<6);
    withPad.set(bytes); withPad[l]=0x80;
    new DataView(withPad.buffer).setUint32(withPad.length-4, bl>>>0);
    new DataView(withPad.buffer).setUint32(withPad.length-8, Math.floor(bl/0x100000000));
    const H=H0.slice(), w=new Int32Array(64), dv=new DataView(withPad.buffer);
    for(let i=0;i<withPad.length;i+=64){
      for(let t=0;t<16;t++) w[t]=dv.getInt32(i+t*4);
      for(let t=16;t<64;t++){
        const s0=rr(w[t-15],7)^rr(w[t-15],18)^(w[t-15]>>>3);
        const s1=rr(w[t-2],17)^rr(w[t-2],19)^(w[t-2]>>>10);
        w[t]=(w[t-16]+s0+w[t-7]+s1)|0;
      }
      let [a,b,c,d,e,f,g,h]=H;
      for(let t=0;t<64;t++){
        const S1=rr(e,6)^rr(e,11)^rr(e,25), ch=(e&f)^(~e&g);
        const t1=(h+S1+ch+K[t]+w[t])|0;
        const S0=rr(a,2)^rr(a,13)^rr(a,22), mj=(a&b)^(a&c)^(b&c);
        const t2=(S0+mj)|0;
        h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
      }
      [a,b,c,d,e,f,g,h].forEach((v,j)=>H[j]=(H[j]+v)|0);
    }
    const out=new Uint8Array(32), o=new DataView(out.buffer);
    H.forEach((v,j)=>o.setInt32(j*4,v));
    return out;
  };
})();
const enc = s => new TextEncoder().encode(s);
const hex = b => Array.from(b).map(x=>x.toString(16).padStart(2,"0")).join("");
function stretch(pw, salt, rounds){
  let cur = SHA256(enc(salt + "\u0000" + pw));
  for(let i=0;i<(rounds||20000);i++){
    const buf = new Uint8Array(cur.length + 4);
    buf.set(cur); new DataView(buf.buffer).setUint32(cur.length, i);
    cur = SHA256(buf);
  }
  return hex(cur);
}
function randSalt(){
  const a = new Uint8Array(16);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
  else for(let i=0;i<16;i++) a[i] = Math.floor(Math.random()*256);
  return hex(a);
}

/* ---------- identifikatorni tekshirish ---------- */
const RE_MAIL = /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i;
function normLogin(v){
  const s = String(v||"").trim();
  if(!s) return null;
  if(RE_MAIL.test(s)) return {kind:"email", id:s.toLowerCase()};
  const d = s.replace(/[^\d+]/g,"");
  let digits = d.replace(/\D/g,"");
  if(digits.length===9) digits = "998"+digits;              // 90 123 45 67
  if(digits.length===12 && digits.startsWith("998"))
    return {kind:"phone", id:"+"+digits};
  if(digits.length>=10 && digits.length<=15)
    return {kind:"phone", id:"+"+digits};                    // boshqa davlat kodi
  return null;
}
function fmtLogin(u){
  if(!u) return "";
  if(u.kind==="phone"){
    const d=u.login.replace(/\D/g,"");
    if(d.length===12) return `+${d.slice(0,3)} ${d.slice(3,5)} ${d.slice(5,8)} ${d.slice(8,10)} ${d.slice(10)}`;
  }
  return u.login;
}

     && typeof auSessionLost === "function") setTimeout(()=>auSessionLost(j.err), 0);

    const salt = randSalt();
    users[nl.id] = {login:nl.id, kind:nl.kind, name:(name||"").trim(),
                    role:role||"other", salt, hash:stretch(pw, salt),
                    created:new Date().toISOString()};
    await this.saveUsers(users);
    return {user:users[nl.id]};
  },

  async login(login, pw){
    const nl = normLogin(login);
    if(!nl) return {err:"auth.badlogin"};
    if(REMOTE) return api("login", {login:nl.id, pw});
    const users = await this.users();
    const u = users[nl.id];
    if(!u) return {err:"auth.nouser"};
    if(stretch(pw, u.salt) !== u.hash) return {err:"auth.badpw"};
    return {user:u};
  },

  async changePw(login, oldPw, newPw){
    if(!newPw || newPw.length < 6) return {err:"auth.shortpw"};
    if(REMOTE) return api("changePw", {old:oldPw, pw:newPw});
    const r = await this.login(login, oldPw);
    if(r.err) return r;
    const users = await this.users();
    const salt = randSalt();
    users[login].salt = salt; users[login].hash = stretch(newPw, salt);
    await this.saveUsers(users);
    return {user:users[login]};
  },

  key(){ return "fc:data:" + (this.user ? this.user.login : "anon"); },
  async data(force){
    if(!REMOTE) return (await store.get(this.key())) || {records:[], last:null};
    if(this._cache && !force) return this._cache;
    const r = await api("myRecords");
    if(r.err) return {records:[], last:null, err:r.err};
    this._cache = {records:r.records || [], last:r.last || null};
    return this._cache;
  },
  async setData(d){ return store.set(this.key(), d); }      // faqat lokal rejim
};

/* ---------- yozuvlar (ma’lumotlar bazasi) ---------- */
async function saveRecord(){
  if(!AUTH.user) return {err:"auth.nosession"};
  readInputs();
  const o = computeAll();
  const rec = {
    id: docId(),
    ts: new Date().toISOString(),
    date: S.a.date || new Date().toISOString().slice(0,10),
    name: S.a.name || "—",
    sport: S.a.sport, wt: S.a.wt, age: S.a.age, sex: S.a.sex,
    tdee: Math.round(o.tdee.total), kcal: Math.round(o.mac.kcal),
    idx: {AI:o.idx.AI, EDI:o.idx.EDI, HSI:o.idx.HSI, MRI:o.idx.MRI},
    snapshot: {a:S.a, acts:S.acts, labs:S.labs,
               menu:{kcal:S.menuKcal, days:S.menu?S.menu.length:7,
                     opts:menuOpts(), set:menuSet()}}
  };
  if(REMOTE){
    const r = await api("saveRecord", {rec});
    AUTH._cache = null;
    return r.err ? r : {rec};
  }
  const d = await AUTH.data();
  d.records = (d.records||[]).filter(r=>r.id !== rec.id);
  d.records.unshift(rec);
  if(d.records.length > 300) d.records.length = 300;
  d.last = rec.snapshot;
  await AUTH.setData(d);
  return {rec};
}

async function loadRecord(id){
  const d = await AUTH.data();
  const rec = (d.records||[]).find(r=>r.id===id);
  if(!rec) return false;
  applySnapshot(rec.snapshot);
  return true;
}

function applySnapshot(sn){
  if(!sn) return;
  const map = {name:"i-name",age:"i-age",sex:"i-sex",wt:"i-wt",ht:"i-ht",bf:"i-bf",
    sport:"i-sport",phase:"i-phase",intens:"i-intens",temp:"i-temp",goal:"i-goal",date:"i-date"};
  Object.entries(map).forEach(([k,id])=>{
    const e=$("#"+id); if(e && sn.a && sn.a[k]!=null && sn.a[k]!=="") e.value = sn.a[k];
  });
  if(sn.acts) S.acts = sn.acts;
  LABS.forEach(l=>{ const e=$("#lab-"+l.id);
    if(e) e.value = (sn.labs && sn.labs[l.id]!=null) ? sn.labs[l.id] : ""; });
  if(sn.menu){
    if($("#m-kcal")) $("#m-kcal").value = sn.menu.kcal || 2900;
    if($("#m-days")) $("#m-days").value = sn.menu.days || 7;
    if(sn.menu.opts){
      if($("#m-regime"))   $("#m-regime").value   = sn.menu.opts.dist || "std";
      if($("#m-season"))   $("#m-season").value   = sn.menu.opts.season || "std";
      if($("#m-training")) $("#m-training").value = sn.menu.opts.training ? "1" : "0";
    }
    if($("#m-set")) $("#m-set").value = sn.menu.set || "s14";
  }
  drawActs(); refresh(); runMenu();
}

async function deleteRecord(id){
  if(REMOTE){ const r = await api("deleteRecord", {id}); AUTH._cache = null; return r; }
  const d = await AUTH.data();
  d.records = (d.records||[]).filter(r=>r.id!==id);
  await AUTH.setData(d);
}

async function wipeAll(){
  if(!AUTH.user) return {err:"auth.nosession"};
  if(REMOTE){ const r = await api("wipeMine"); AUTH._cache = null; return r; }
  await AUTH.setData({records:[], last:null});
  return {ok:true};
}

/* ---------- eksport / import ---------- */
async function exportAll(){
  const d = await AUTH.data();
  const payload = {
    format:"food-calculator/records", version:1,
    exported:new Date().toISOString(),
    account:{login:AUTH.user.login, kind:AUTH.user.kind,
             name:AUTH.user.name, role:AUTH.user.role},
    records:d.records || []
  };
  download("food_calculator_data_"+AUTH.user.login.replace(/[^\w]/g,"_")+".json",
           JSON.stringify(payload,null,2), "application/json");
  return payload.records.length;
}

async function importAll(text){
  let j; try{ j = JSON.parse(text); }catch(e){ return {err:"db.badfile"}; }
  if(!j || j.format!=="food-calculator/records" || !Array.isArray(j.records))
    return {err:"db.badfile"};
  if(REMOTE){
    const r = await api("importRecords", {records:j.records});
    AUTH._cache = null;
    return r;
  }
  const d = await AUTH.data();
  const have = new Set((d.records||[]).map(r=>r.id));
  let added=0;
  j.records.forEach(r=>{ if(r && r.id && !have.has(r.id)){ d.records.push(r); added++; } });
  d.records.sort((a,b)=> (b.ts||"").localeCompare(a.ts||""));
  await AUTH.setData(d);
  return {added, total:d.records.length};
}

<script>
"use strict";
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- saqlash qatlami (artefakt / brauzer / xotira) ---------- */
const store = (()=>{
  const mem = {};
  const has = k => typeof window!=="undefined" && window.storage && typeof window.storage[k]==="function";
  return {
    async set(k,v){ const s=JSON.stringify(v);
      if(has("set")){ try{ await window.storage.set(k,s); return true; }catch(e){} }
      try{ localStorage.setItem(k,s); return true; }catch(e){ mem[k]=s; return true; } },
    async get(k){
      if(has("get")){ try{ const r=await window.storage.get(k); if(r&&r.value) return JSON.parse(r.value);}catch(e){} }
      try{ const v=localStorage.getItem(k); if(v) return JSON.parse(v); }catch(e){}
      return mem[k] ? JSON.parse(mem[k]) : null; }
  };
})();

/* =====================================================================
   Til
   ===================================================================== */
function applyLang(){
  document.documentElement.lang = LANG ? "en" : "uz";
  $$("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  $("#lang-uz").setAttribute("aria-pressed", LANG?"false":"true");
  $("#lang-en").setAttribute("aria-pressed", LANG?"true":"false");
  if(!S.booted){ if(typeof auSetMode==="function") auSetMode(AU_MODE); return; }
  buildLabFields(); drawActs(); drawFlow(); fillPresets(); refresh();
  if(S.menu) drawMenu();
  auSetMode(AU_MODE); drawUserChip(); drawRecords();
}

/* =====================================================================
   Kirish maydonlari
   ===================================================================== */
function readInputs(){
  S.a = {
    name:$("#i-name").value.trim(), age:num($("#i-age"))||22, sex:$("#i-sex").value,
    wt:num($("#i-wt"))||75, ht:num($("#i-ht"))||178, bf:num($("#i-bf")),
    sport:$("#i-sport").value, phase:$("#i-phase").value,
    intens:parseInt($("#i-intens").value,10), temp:parseInt($("#i-temp").value,10),

  };
  LABS.forEach(l => { const el=$("#lab-"+l.id); S.labs[l.id] = el ? num(el) : null; });
}

/* ---------- laborator maydonlari ---------- */
function buildLabFields(){
  ["acid","elec","horm"].forEach(g=>{
    const box=$("#lab-"+g); if(!box) return;
    const prev = {}; LABS.forEach(l=>{ const e=$("#lab-"+l.id); if(e) prev[l.id]=e.value; });
    box.innerHTML = LABS.filter(l=>l.grp===g).map(l=>`
      <div class="field" id="fw-${l.id}">
        <label>${esc(nm(l))} ${l.u?`<span class="unit">${esc(l.u)}</span>`:""}</label>
        <input id="lab-${l.id}" type="number" step="${l.step}" inputmode="decimal" placeholder="—"
               value="${prev[l.id]!==undefined?esc(prev[l.id]):(S.labs[l.id]??"")}">
        <span class="ref">${l.lo}–${l.hi}${l.u?" "+esc(l.u):""}</span>
      </div>`).join("");
  });
  $$("[id^=lab-][type=number]").forEach(el=>el.addEventListener("input", refresh));
}

/* =====================================================================
   Faoliyat jadvali
   ===================================================================== */
function actOptions(sel){
  return ACTS.map(a=>`<option value="${a.id}"${a.id===sel?" selected":""}>${esc(nm(a))}</option>`).join("");
}
function drawActs(){
  const tb=$("#act-rows");
  tb.innerHTML = S.acts.map((r,i)=>{
    const a=ACTMAP[r.id]||ACTS[0];
    return `<tr data-i="${i}">
      <td class="mono" style="color:var(--mute);font-size:12px">${i+1}</td>
      <td><select class="a-id">${actOptions(r.id)}</select></td>
      <td><input class="a-min" type="number" min="0" max="1440" step="5" value="${r.min}"></td>
      <td class="n" style="color:var(--mute)">${a.c.toFixed(4)}</td>
      <td class="n a-kcal">—</td>
      <td class="noprint"><button class="xbtn a-del" aria-label="remove">×</button></td>
    </tr>`;
  }).join("") || `<tr><td colspan="6" class="empty">${esc(t("btn.addrow"))}</td></tr>`;

  tb.querySelectorAll(".a-id").forEach((el,i)=>el.addEventListener("change",e=>{
    S.acts[i].id=e.target.value; drawActs(); refresh(); }));
  tb.querySelectorAll(".a-min").forEach((el,i)=>el.addEventListener("input",e=>{
    S.acts[i].min=clamp(parseInt(e.target.value,10)||0,0,1440); refresh(); }));
  tb.querySelectorAll(".a-del").forEach((el,i)=>el.addEventListener("click",()=>{
    S.acts.splice(i,1); drawActs(); refresh(); }));
}

/* =====================================================================
   Chizish
   ===================================================================== */
function statBlock(items){
  return items.map(x=>`<div class="stat"><div class="k">${esc(x.k)}</div>
    <div class="v">${x.v}${x.u?` <small>${esc(x.u)}</small>`:""}</div>
    ${x.x?`<div class="x">${esc(x.x)}</div>`:""}</div>`).join("");
}

function refresh(){
  readInputs();
  const o = computeAll();
  drawBMR(o); drawDay(o); drawPh(o); drawDev(); drawIdx(o);
  drawEnergy(o); drawMinerals(o); drawFluid(o); drawRx(o);
  drawPlan(o);
  flagLabs(); stamp();
}

function drawBMR(o){
  const a=S.a, bmi=a.wt/Math.pow(a.ht/100,2);
  $("#bmr-stats").innerHTML = statBlock([
    {k:t("s.bmr"), v:n(o.bmr.v), u:"kkal"},
    {k:t("s.eq"), v:`<span style="font-size:13px">${o.bmr.eq}</span>`},
    {k:t("s.bmi"), v:n(bmi,1)},
    o.bmr.lbm ? {k:t("s.lbm"), v:n(o.bmr.lbm,1), u:"kg"}
              : {k:t("s.perkg"), v:n(o.bmr.v/a.wt,1), u:"kkal/kg"}
  ]);
}

function drawDay(o){
  const T=o.tdee;
  T.rows.forEach((r,i)=>{
    const td=document.querySelector(`#act-rows tr[data-i="${i}"] .a-kcal`);
    if(td) td.textContent = n(r.kcal,1);
  });
  $("#f-min").textContent = n(T.min);
  $("#f-min").style.color = T.complete ? "" : "var(--alarm)";
  $("#f-kgkcal").textContent = n(T.kgkcal,3);
  $("#f-kcal").textContent = n(T.activity);

  const frac = clamp(T.min/1440,0,1), C=2*Math.PI*68;
  const arc=$("#dial-arc");
  arc.setAttribute("stroke-dasharray", `${(frac*C).toFixed(1)} ${C.toFixed(1)}`);
  arc.setAttribute("stroke", T.complete ? "var(--neutral)" : T.min>1440 ? "var(--alarm)" : "var(--acid)");
  $("#dial-min").textContent = n(T.min);
  $("#dial-delta").innerHTML = T.complete
    ? `<span style="color:var(--neutral)">✓ 1440</span>`
    : `<span style="color:${T.min>1440?"var(--alarm)":"var(--acid)"}">${T.delta>0?"+":""}${n(T.delta)} ${LANG?"min":"daq."}</span>`;

  $("#tdee-stats").innerHTML = statBlock([
    {k:t("s.act"),  v:n(T.activity), u:"kkal"},
    {k:t("s.tef"),  v:"+"+n(T.tef),  u:"kkal", x:"×1.10"},
    {k:t("s.neat"), v:"+"+n(T.neat), u:"kkal", x:"×1.05"},
    {k:t("s.tdee"), v:`<b>${n(T.total)}</b>`, u:"kkal"},
    {k:t("s.perkg"),v:n(T.total/S.a.wt,1), u:"kkal/kg"},
    {k:t("s.train"),v:n(T.trainH,1), u:LANG?"h":"soat"},
    {k:t("s.paf"),  v:n(T.total/o.bmr.v,2)}
  ]);
}

function drawPh(o){
  const ph=S.labs.ph, m=$("#ph-marker"), box=$("#ph-verdict");
  if(ph==null){ m.style.display="none"; box.innerHTML=`<span class="tag info">${esc(t("ph.none"))}</span>`; return; }
  m.style.display=""; m.style.left = clamp((ph-7.10)/0.60*100,0,100)+"%";
  let tag,txt;
  if(ph<7.35){ tag="bad"; txt=t("ph.acid"); }
  else if(ph>7.45){ tag="warn"; txt=t("ph.alk"); }
  else { tag="ok"; txt=t("ph.norm"); }
  box.innerHTML = `<span class="tag ${tag}">${esc(txt)}</span>
    <span class="mono" style="margin-left:8px;font-size:16px">pH ${ph.toFixed(2)}</span>`;
}

function drawDev(){
  const rows=[];
  LABS.forEach(l=>{
    const v=S.labs[l.id]; if(v==null) return;
    const dv=deviation(l,v);
    if(dv.d<=0) return;
    const sev = dv.d>1.2 ? "bad" : "warn";
    rows.push(`<tr><td>${esc(nm(l))}</td>
      <td class="n">${n(v, l.step<0.05?2:1)}</td>
      <td class="n" style="color:var(--mute)">${l.lo}–${l.hi}</td>
      <td class="n"><span class="tag ${sev}">${dv.side==="lo"?esc(t("dev.lo")):esc(t("dev.hi"))} ${n(dv.d,2)}σ</span></td></tr>`);
  });
  const any = LABS.some(l=>S.labs[l.id]!=null);
  $("#dev-list").innerHTML = rows.length
    ? `<table class="t"><thead><tr><th>${esc(t("th.ind"))}</th><th class="n">${esc(t("th.val"))}</th>
       <th class="n">${esc(t("th.norm"))}</th><th class="n">${esc(t("th.dev"))}</th></tr></thead>
       <tbody>${rows.join("")}</tbody></table>`
    : `<div class="empty">${esc(any?t("dev.none"):t("dev.empty"))}</div>`;
}

function flagLabs(){
  LABS.forEach(l=>{
    const w=$("#fw-"+l.id); if(!w) return;
    w.classList.remove("flag","flag-bad");
    const v=S.labs[l.id]; if(v==null) return;
    const dv=deviation(l,v);
    if(dv.d>1.2) w.classList.add("flag-bad"); else if(dv.d>0) w.classList.add("flag");
  });
}

     <tbody>
      <tr><td>${esc(t("e.prot"))}</td><td class="n">${n(M.P)}</td><td class="n">${n(M.pk,2)}</td><td class="n">${n(M.P*4)}</td><td class="n">${n(M.pPct,1)}</td></tr>
      <tr><td>${esc(t("e.fat"))}</td><td class="n">${n(M.F)}</td><td class="n">${n(M.fk,2)}</td><td class="n">${n(M.F*9)}</td><td class="n">${n(M.fPct,1)}</td></tr>
      <tr><td>${esc(t("e.carb"))}</td><td class="n">${n(M.C)}</td><td class="n">${n(M.ck,1)}</td><td class="n">${n(M.C*4)}</td><td class="n">${n(M.cPct,1)}</td></tr>

function drawMinerals(o){
  const m=o.mins.m, order=[["mg","Mg²⁺"],["k","K⁺"],["ca","Ca²⁺"],["na","Na⁺"],["fe","Fe"],["zn","Zn"]];

     <tbody>${order.map(([k,lab])=>{
       const x=m[k], lowf=o.mins.low(k);

     <tr><td>PRAL ${LANG?"target":"maqsadi"}</td><td class="n" style="color:var(--mute)">0</td>

     <tr><td>${esc(t("nut.fib"))}</td><td class="n" style="color:var(--mute)">${n(o.fib.base)}</td>
       <td class="n" style="color:var(--mute)">${o.fib.v>o.fib.base?"+"+n(o.fib.v-o.fib.base):"—"}</td>

     </tbody>`;

function drawFluid(o){
  const F=o.fl;
  $("#fluid-stats").innerHTML = statBlock([
    {k:t("fl.total"),  v:`<b>${n(F.total)}</b>`, u:"ml"},
    {k:t("fl.sweat"),  v:n(o.mins.sweat,2), u:"L"},

    {k:t("fl.alk"),    v:n(F.alkWater), u:"ml"}
  ]);

  if(F.cho_h) list.push([t("fl.cho"), n(F.cho_h)+" g"]);
  $("#fluid-notes").innerHTML = `<table class="t"><tbody>${
    list.map(([a,b])=>`<tr><td>${esc(a)}</td><td class="n">${esc(b)}</td></tr>`).join("")}</tbody></table>`;
}

function drawRx(o){
  $("#rx-list").innerHTML = o.rx.map(x=>{

const DAYNAME = [["Dushanba","Seshanba","Chorshanba","Payshanba","Juma","Shanba","Yakshanba",
                  "8-kun","9-kun","10-kun","11-kun","12-kun","13-kun","14-kun","15-kun"],
                 ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday",
                  "Day 8","Day 9","Day 10","Day 11","Day 12","Day 13","Day 14","Day 15"]];

function menuOpts(){
  return {
    dist: $("#m-regime") ? $("#m-regime").value : "std",
    season: $("#m-season") ? $("#m-season").value : "std",
    training: $("#m-training") ? $("#m-training").value === "1" : true
  };
}
function menuKcal(){
  const src = $("#m-source") ? $("#m-source").value : "manual";
  if(src === "calc" && S.out) return Math.round(S.out.mac.kcal);
  const v = num($("#m-kcal"));
  return clamp(v || 2900, 800, 8000);
}
function menuSet(){ return $("#m-set") ? $("#m-set").value : "s14"; }

function runMenu(){
  const kcal = menuKcal(), days = parseInt($("#m-days").value,10) || 7;
  computeMenu(kcal, days, menuOpts());
  if(S.menuDay >= days) S.menuDay = 0;
  drawMenu();
}

function drawMenu(){
  const box = $("#menu-out"); if(!box) return;
  if(!S.menu){ box.innerHTML = `<div class="empty">${esc(t("menu.run"))}</div>`; return; }

  const kcal = S.menuKcal, mac = S.menuMac, setId = menuSet();
  const tgt = sqGroupTargets(kcal, setId);

  $("#day-tabs").innerHTML = S.menu.map((d,i)=>
    `<button class="btn sm ${i===S.menuDay?"":"ghost"}" data-day="${i}">${esc(DAYNAME[LANG][i]||("#"+(i+1)))}</button>`).join("");
  $$("#day-tabs [data-day]").forEach(b=>b.addEventListener("click",()=>{
    S.menuDay=+b.dataset.day; drawMenu(); }));

  const D = S.menu[S.menuDay], T = D.tot;
  const RG = SQ.rangeBy[menuOpts().dist] || SQ.range;
  const c2 = (v,d=1)=>n(v,d);

  /* --- asosiy jadval --- */
  let rows = "";
  D.meals.forEach(m=>{
    const pct = 100*m.tot.kcal/Math.max(T.kcal,1), r = RG[m.slot];
    const ok = pct >= r[0]-2 && pct <= r[1]+2;
    rows += `<tr class="mhead"><td colspan="4">${esc(SQ.name[m.slot][LANG])}
        <span class="mono" style="font-weight:400;color:var(--ink3);margin-left:8px">${esc(SQ.time[m.slot][LANG])}</span>
        <span class="tag ${ok?"ok":"warn"}" style="margin-left:8px">${pct.toFixed(1)} % · ${r[0]}–${r[1]} %</span></td>
      <td class="n">${c2(m.tot.p)}</td><td class="n">${c2(m.tot.f)}</td>
      <td class="n">${c2(m.tot.c)}</td><td class="n">${n(m.tot.kcal)}</td>
      <td class="n">${n(m.tot.soum)}</td></tr>`;
    m.dishes.forEach(x=>{
      rows += `<tr class="dhead"><td>${esc(nm(x.d))}</td>
        <td class="n">${n(x.tot.portion)} g</td><td colspan="7"></td></tr>`;
      x.rows.forEach(rw=>{
        rows += `<tr><td class="ing">${esc(nm(rw.I))}</td><td></td>
          <td class="n">${n(rw.brutto,rw.brutto<3?1:0)}</td>
          <td class="n">${n(rw.netto,rw.netto<3?1:0)}</td>
          <td class="n s">${c2(rw.p)}</td><td class="n s">${c2(rw.f)}</td>
          <td class="n s">${c2(rw.c)}</td><td class="n s">${n(rw.kcal)}</td>
          <td class="n s">${n(rw.soum)}</td></tr>`;
      });
    });
  });
  rows += `<tr class="dtot"><td colspan="4">${esc(t("mn.tot"))}</td>
      <td class="n">${c2(T.p)}</td><td class="n">${c2(T.f)}</td>
      <td class="n">${c2(T.c)}</td><td class="n">${n(T.kcal)}</td>
      <td class="n">${n(T.soum)}</td></tr>`;

  box.innerHTML =
    `<div class="stats" style="margin-bottom:14px">${statBlock([
      {k:t("mn.target"), v:n(kcal), u:"kkal"},
      {k:t("mn.tot"), v:`<b>${n(T.kcal)}</b>`, u:"kkal", x:`${T.kcal>=kcal?"+":""}${n(T.kcal-kcal)}`},
      {k:t("e.prot"), v:c2(T.p), u:"g", x:`${t("mn.target")} ${n(mac.P)}`},
      {k:t("e.fat"),  v:c2(T.f), u:"g", x:`${t("mn.target")} ${n(mac.F)}`},
      {k:t("e.carb"), v:c2(T.c), u:"g", x:`${t("mn.target")} ${n(mac.C)}`},
      {k:t("nut.fib"),v:c2(T.fib), u:"g"},
      {k:t("mn.price"), v:`<b>${n(T.soum)}</b>`, u:"so‘m", x:t("mn.perday")},
      {k:t("mn.week"), v:n(S.menu.reduce((s,d)=>s+d.tot.soum,0)), u:"so‘m",
       x:`${S.menu.length} ${LANG?"days":"kun"}`}
    ])}</div>
    <div class="tblwrap"><table class="t menu">
      <thead><tr>
        <th style="width:24%">${esc(t("th.dish"))}</th><th class="n">${esc(t("th.portion"))}</th>
        <th class="n">${esc(t("th.brutto"))}</th><th class="n">${esc(t("th.netto"))}</th>
        <th class="n">${esc(t("e.prot"))}</th><th class="n">${esc(t("e.fat"))}</th>
        <th class="n">${esc(t("e.carb"))}</th><th class="n">${esc(t("th.kcal"))}</th>
        <th class="n">${esc(t("th.soum"))}</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;

  /* --- muvofiqlik nazorati --- */
  const chk = sqCheck(D, kcal, mac, setId, menuOpts().dist);
  box.insertAdjacentHTML("beforeend",
    `<div class="sechead" style="margin-top:24px">${esc(t("sq.check"))}</div>
     ${chk.map(c=>`<div class="rx ${c.k==="bad"?"bad":c.k==="warn"?"warn":"ok"}">
       <div class="h">${esc(t("sq.band"))} ${c.band}</div><p>${esc(LANG?c.en:c.uz)}</p></div>`).join("")}`);

  /* --- oziq-ovqat guruhlari (1/2-ilova) --- */
  const ga = D.tot.groups || {};
  box.insertAdjacentHTML("beforeend",
    `<div class="sechead" style="margin-top:24px">${esc(t("sq.groups"))}</div>
     <table class="t"><thead><tr><th>${esc(t("grp.g"))}</th>
       <th class="n">${esc(t("grp.min"))}</th><th class="n">${esc(t("grp.act"))}</th>
       <th class="n">%</th></tr></thead><tbody>${
      ["gr","lg","vg","fr","mk","mt","ft","sw"].map(g=>{
        const need=tgt[g]||0, have=Math.round(ga[g]||0);
        const pct = need ? Math.round(100*have/need) : null;
        const col = pct===null ? "var(--mute)" : pct>=85 ? "var(--neutral)" : pct>=60 ? "var(--acid)" : "var(--alarm)";
        return `<tr><td>${esc(GRP_NAME[g][LANG])}</td>
          <td class="n" style="color:var(--mute)">${need?n(need)+" g":"—"}</td>
          <td class="n">${n(have)} g</td>
          <td class="n" style="color:${col}"><b>${pct===null?"—":pct}</b></td></tr>`;
      }).join("")}</tbody></table>
     <div class="docref">${esc(t("sq.setref"))} — ${esc(SQ_SET[setId].label[LANG])}</div>
     <div class="rx" style="margin-top:12px"><div class="h">${esc(t("sq.drink"))}</div>
       <p>${LANG
        ? `Daily fluid ${SQ.drink.dayMin}–${SQ.drink.dayMax} ml (item 52), no more than ${SQ.drink.hourMax} ml per hour (item 49), in portions of ${SQ.drink.sip[0]}–${SQ.drink.sip[1]} ml (item 48). After hot weather or heavy sessions the drink temperature should be ${SQ.drink.temp[0]}–${SQ.drink.temp[1]} °C (item 50). Carbonated water, glucose–electrolyte solutions above 8 % carbohydrate and energy drinks are not permitted (items 54–55).`
        : `Sutkalik suyuqlik ${SQ.drink.dayMin}–${SQ.drink.dayMax} ml (52-band), soatiga ${SQ.drink.hourMax} ml dan oshmagan holda (49-band), har biri ${SQ.drink.sip[0]}–${SQ.drink.sip[1]} ml qismlarga bo‘lib (48-band). Issiq havoda va yuqori yuklamadan so‘ng ichimlik harorati ${SQ.drink.temp[0]}–${SQ.drink.temp[1]} °C bo‘lishi kerak (50-band). Gazlangan suv, uglevod miqdori 8 % dan ortiq glyukoza-elektrolit eritmalari va energetik ichimliklar taqiqlanadi (54–55-bandlar).`}</p></div>`);
}

function fillPresets(){

  const opt = (v,l)=>`<option value="${v}">${esc(l)}</option>`;
  sel.innerHTML =
    opt("", LANG?"— choose a reference —":"— tayanch qiymatni tanlang —") +
    `<optgroup label="${esc(LANG?"SanQvaN Appendix 4 — athletes":"SanQvaN 4-ilova — sportchilar")}">` +
    SQ_APX4.map((r,i)=>opt("a"+i,
      `${r.sport[LANG]} · ${r.sex==="m"?(LANG?"boys":"o‘g‘il"):(LANG?"girls":"qiz")} ${r.age} · ${r.kcal} kkal`)).join("") +
    `</optgroup><optgroup label="${esc(LANG?"Non-athletes":"Sportchi bo‘lmaganlar")}">` +
    NONSPORT.map((r,i)=>opt("n"+i, `${r.lab[LANG]} · ${r.kcal} kkal`)).join("") +

function applyMenuPreset(v){
  if(!v) return;
  const i = parseInt(v.slice(1),10);
  const rec = v[0]==="a" ? SQ_APX4[i] : NONSPORT[i];
  $("#m-kcal").value = rec.kcal;
  $("#m-source").value = "manual";
  if(v[0]==="a"){
    $("#m-set").value = rec.age === "11-13" ? "s11" : "s14";
    $("#apx4-note").innerHTML = apx4Note(rec);
  } else $("#apx4-note").innerHTML = "";
  runMenu();
}
function apx4Note(r){
  const mk = 4*r.p + 9*r.f + 4*r.c;
  const gap = mk - r.kcal;
  return `<div class="rx ${Math.abs(gap)>300?"warn":""}"><div class="h">${esc(t("sq.apx4"))}</div>
    <p>${LANG
      ? `Appendix 4 lists ${r.kcal} kcal with ${r.p} g protein (${r.pa} g animal), ${r.f} g fat (${r.fv} g vegetable) and ${r.c} g carbohydrate. Those macronutrients themselves amount to ${Math.round(mk)} kcal — a difference of ${gap>0?"+":""}${Math.round(gap)} kcal from the stated energy figure. The platform therefore takes the energy from the appendix and derives macronutrients from the 1:(0.8–0.9):(3.5–4.5) ratio of item 7.`
      : `4-ilovada ${r.kcal} kkal, ${r.p} g oqsil (shundan ${r.pa} g hayvon oqsili), ${r.f} g yog‘ (${r.fv} g o‘simlik yog‘i) va ${r.c} g uglevod ko‘rsatilgan. Ushbu makronutrientlarning o‘zi ${Math.round(mk)} kkal beradi — e’lon qilingan energiya raqamidan ${gap>0?"+":""}${Math.round(gap)} kkal farq qiladi. Shu sababli platforma energiyani ilovadan oladi, makronutrientlarni esa 7-banddagi 1:(0,8–0,9):(3,5–4,5) nisbatidan hisoblaydi.`}</p></div>`;
}
